<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MotoRadar 3D - Perspectiva Inteligente</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            background-color: #0c0d0f; overflow: hidden;
            /* Activamos la perspectiva 3D en el contenedor principal */
            perspective: 900px;
        }

        /* Contenedor intermedio para aislar la rotación del mapa y que no afecte a los menús */
        #escenario-3d {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            transform: rotateX(54deg); /* Inclinación tipo GPS */
            transform-origin: center bottom;
            background: #0c0d0f;
        }

        /* El mapa se estira para evitar que los bordes superiores dejen ver el fondo al inclinarse */
        #map { 
            position: absolute; 
            top: -30%; left: -10%; width: 120%; height: 140%; 
            background: #0c0d0f !important;
        }

        .leaflet-pane, .leaflet-tile, .leaflet-marker-icon { 
            background: transparent !important; 
            border: none !important;
        }

        /* --- MARCADOR DE FLECHA 3D ESTILIZADO --- */
        .contenedor-flecha-moto {
            background: transparent !important;
            border: none !important;
        }
        
        /* Corregimos la deformación del mapa aplicando a la flecha la inclinación inversa */
        .flecha-triangulo {
            width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 32px solid #d60056; /* Color magenta/rojo de tu captura */
            position: relative;
            transform: rotateX(-54deg); /* Contrarresta la inclinación del mapa */
            filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.6)) drop-shadow(0px 0px 10px rgba(214,0,86,0.4));
        }
        /* Efecto de brillo o cara interna del triángulo simulando 3D */
        .flecha-triangulo::after {
            content: ''; position: absolute;
            top: 0; left: -18px; width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 0px solid transparent;
            border-bottom: 32px solid rgba(255, 255, 255, 0.15);
        }

        /* Capas superiores fijas (No se ven afectadas por el 3D) */
        #filtro-alerta {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 2; pointer-events: none;
            background-color: rgba(0, 0, 0, 0);
            transition: background-color 0.2s ease;
        }

        #capa-alerta {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            z-index: 10; background-color: rgba(25, 26, 30, 0.96);
            border-radius: 14px; padding: 12px 20px;
            display: flex; align-items: center; gap: 15px; backdrop-filter: blur(10px);
            border: 1px solid #2d3035; min-width: 320px; justify-content: start;
            box-shadow: 0px 6px 16px rgba(0,0,0,0.6);
        }
        #flecha { font-size: 32px; font-weight: bold; line-height: 1; min-width: 40px; text-align: center; }
        #datos-curva { display: flex; flex-direction: column; }
        #distancia { font-size: 20px; font-weight: bold; color: white; }
        #estado { font-size: 13px; color: #9aa0a6; margin-top: 1px; font-weight: bold; }

        #config-casa {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            z-index: 10; background-color: rgba(25, 26, 30, 0.96); padding: 16px; border-radius: 14px;
            width: 90%; max-width: 360px; text-align: left; border: 1px solid #2d3035;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.7); backdrop-filter: blur(10px);
        }
        #selector-ubicacion-label {
            display: flex; align-items: center; gap: 10px;
            color: #9aa0a6; font-size: 13px; font-weight: bold; margin-bottom: 8px;
        }
        #selector-ubicacion-label span { font-size: 18px; }

        input { 
            width: 100%; padding: 12px; border-radius: 8px; 
            border: 1px solid #3c4043; background: #1f2023; color: white; 
            font-size: 16px; text-align: center; margin-bottom: 10px;
        }
        button { 
            width: 100%; padding: 12px; border-radius: 8px; border: none; 
            background: #007bef; color: white; font-weight: bold; font-size: 16px;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #0056a8; }

        /* Contrarrestamos la inclinación en los textos de los pueblos para que se lean rectos */
        .etiqueta-pueblo {
            background: transparent !important; border: none !important; box-shadow: none !important;
            color: #9aa0a6 !important; font-weight: bold; font-size: 12px; text-shadow: 1px 1px 4px #000;
            white-space: nowrap;
            transform: rotateX(-54deg) translateY(-10px); 
            transform-origin: center bottom;
        }
    </style>
</head>
<body>

    <div id="escenario-3d">
        <div id="map"></div>
    </div>

    <div id="filtro-alerta"></div>

    <div id="capa-alerta">
        <div id="flecha">⬆️</div>
        <div id="datos-curva">
            <div id="distancia">MotoRadar Ready</div>
            <div id="estado">Esperando localización...</div>
        </div>
    </div>

    <div id="config-casa">
        <div id="selector-ubicacion-label">
            <span>📍</span> Mi Ubicación
        </div>
        <input type="text" id="zona-input" value="Málaga" placeholder="Málaga, Granada...">
        <button onclick="descargarYProcesarTodo()">Cargar Carreteras y Pueblos</button>
    </div>

    <script>
        const filtroAlerta = document.getElementById('filtro-alerta');
        const flechaEl = document.getElementById('flecha');
        const distanciaEl = document.getElementById('distancia');
        const estadoEl = document.getElementById('estado');

        let mapa;
        let marcadorMoto;
        let capasCarreteras = []; 
        let grupoPueblos = null;
        let curvasZonaOffline = [];

        let modoSeguimientoActivo = true; 
        let temporizadorLiberacion = null;

        let posActual = { lat: 40.4167, lon: -3.7037 };
        let posObjetivo = { lat: 40.4167, lon: -3.7037 };
        const FACTOR_SUAVIZADO = 0.12; 

        function inicializarMapa() {
            mapa = L.map('map', { 
                zoomControl: false, 
                attributionControl: false, 
                preferCanvas: true,
                dragging: true,
                touchZoom: true
            }).setView([posActual.lat, posActual.lon], 6); 

            // Icono de flecha geométrica adaptada a la perspectiva
            const iconoMoto = L.divIcon({
                html: '<div class="flecha-triangulo"></div>',
                className: 'contenedor-flecha-moto',
                iconSize: [36, 32],
                iconAnchor: [18, 16]
            });
            marcadorMoto = L.marker([posActual.lat, posActual.lon], { icon: iconoMoto }).addTo(mapa);
            grupoPueblos = L.layerGroup().addTo(mapa);

            mapa.on('movestart', (e) => {
                if (e.hard) return; 
                pausarSeguimientoTemporal();
            });

            mapa.on('dragstart zoomstart', () => { 
                modoSeguimientoActivo = false; 
                pausarSeguimientoTemporal();
            });

            bucleAnimacionFluida();
        }

        function pausarSeguimientoTemporal() {
            modoSeguimientoActivo = false;
            clearTimeout(temporizadorLiberacion);
            temporizadorLiberacion = setTimeout(() => {
                modoSeguimientoActivo = true; 
            }, 6000);
        }

        function bucleAnimacionFluida() {
            posActual.lat += (posObjetivo.lat - posActual.lat) * FACTOR_SUAVIZADO;
            posActual.lon += (posObjetivo.lon - posActual.lon) * FACTOR_SUAVIZADO;
            marcadorMoto.setLatLng([posActual.lat, posActual.lon]);
            
            if (modoSeguimientoActivo) {
                // Al estar el mapa inclinado, añadimos un pequeño offset visual para que la moto 
                // quede en el tercio inferior de la pantalla (estilo GPS real) en lugar del centro geométrico
                const offsetLat = -0.0015; 
                mapa.panTo([posActual.lat - offsetLat, posActual.lon], { animate: false }); 
            }
            requestAnimationFrame(bucleAnimacionFluida);
        }

        async function descargarYProcesarTodo() {
            const zona = document.getElementById('zona-input').value.trim();
            if(!zona) return alert("Escribe una zona válida");

            distanciaEl.innerText = "Sincronizando...";
            estadoEl.innerText = "Conectando con OpenStreetMap...";
            
            const query = `[out:json][timeout:50]; area["name"="${zona}"]->.searchArea; (way["highway"~"primary|secondary|tertiary"](area.searchArea); node["place"~"town|village"](area.searchArea);); out geom;`;
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(!data.elements || data.elements.length === 0) {
                    distanciaEl.innerText = "Error";
                    estadoEl.innerText = "No se encontraron datos.";
                    return;
                }

                capasCarreteras.forEach(c => mapa.removeLayer(c.objetoGrafico));
                capasCarreteras = [];
                grupoPueblos.clearLayers();
                curvasZonaOffline = [];

                let primerPuntoValido = null;

                data.elements.forEach(el => {
                    if (el.type === "way" && el.geometry) {
                        let coordenadas = el.geometry.map(p => [p.lat, p.lon]);
                        if(!primerPuntoValido) primerPuntoValido = coordenadas[0];

                        // Pintamos el "borde" verde brillante de la carretera y el centro blanco/gris
                        let poly = L.polyline(coordenadas, {
                            color: '#55b058', weight: 6, opacity: 0.8 /* Color verde exterior */
                        }).addTo(mapa);

                        capasCarreteras.push({ puntos: coordenadas, objetoGrafico: poly });
                        calcularCurvasCarretera(el.geometry);
                    }
                    else if (el.type === "node" && el.tags && el.tags.name) {
                        L.marker([el.lat, el.lon], {
                            icon: L.divIcon({
                                className: 'etiqueta-pueblo',
                                html: `${el.tags.name}`,
                                iconAnchor: [30, 0]
                            })
                        }).addTo(grupoPueblos);
                    }
                });

                if(primerPuntoValido) {
                    posActual = { lat: primerPuntoValido[0], lon: primerPuntoValido[1] };
                    posObjetivo = { lat: primerPuntoValido[0], lon: primerPuntoValido[1] };
                    mapa.setView([primerPuntoValido[0], primerPuntoValido[1]], 15); /* Zoom un poco más cercano */
                }

                modoSeguimientoActivo = true; 
                distanciaEl.innerText = "¡Cargado!";
                estadoEl.innerText = `${curvasZonaOffline.length} curvas listas.`;
                document.getElementById('config-casa').style.display = 'none';

            } catch (error) {
                distanciaEl.innerText = "Error";
                estadoEl.innerText = "Fallo de conexión.";
                console.error(error);
            }
        }

        function calcularCurvasCarretera(puntos) {
            if(puntos.length < 3) return;
            for (let i = 1; i < puntos.length - 1; i++) {
                const pA = puntos[i-1]; const pB = puntos[i]; const pC = puntos[i+1];
                const rumbo1 = Math.atan2(pB.lat - pA.lat, pB.lon - pA.lon) * 180 / Math.PI;
                const rumbo2 = Math.atan2(pC.lat - pB.lat, pC.lon - pB.lon) * 180 / Math.PI;
                let giro = rumbo2 - rumbo1;
                if (giro > 180) giro -= 360; if (giro < -180) giro += 360;
                const anguloAbs = Math.abs(giro);
                const dir = giro >= 0 ? '➡️' : '⬅️';

                if (anguloAbs > 38) curvasZonaOffline.push({ lat: pB.lat, lon: pB.lon, tipo: 'rojo', dir: dir });
                else if (anguloAbs > 18) curvasZonaOffline.push({ lat: pB.lat, lon: pB.lon, tipo: 'naranja', dir: dir });
                else if (anguloAbs > 6) curvasZonaOffline.push({ lat: pB.lat, lon: pB.lon, tipo: 'verde', dir: dir });
            }
        }

        function actualizarPosicion(position) {
            posObjetivo.lat = position.coords.latitude;
            posObjetivo.lon = position.coords.longitude;

            capasCarreteras.forEach(carretera => {
                let motoCercaDeEstaCarretera = false;
                for(let p of carretera.puntos) {
                    if(calcularDistancia(posObjetivo.lat, posObjetivo.lon, p[0], p[1]) < 30) {
                        motoCercaDeEstaCarretera = true;
                        break;
                    }
                }

                if (motoCercaDeEstaCarretera) {
                    carretera.objetoGrafico.setStyle({ color: '#00ffaa', weight: 8, opacity: 1 }); /* Resalte activo */
                } else {
                    carretera.objetoGrafico.setStyle({ color: '#55b058', weight: 6, opacity: 0.8 });
                }
            });

            if (curvasZonaOffline.length === 0) return;
            let curvaCercana = null; let distanciaMinima = Infinity;

            curvasZonaOffline.forEach(curva => {
                const dist = calcularDistancia(posObjetivo.lat, posObjetivo.lon, curva.lat, curva.lon);
                if (dist < distanciaMinima) { distanciaMinima = dist; curvaCercana = curva; }
            });

            if (curvaCercana && distanciaMinima < 200) {
                flechaEl.innerText = curvaCercana.dir;
                distanciaEl.innerText = `${Math.round(distanciaMinima)} m`;
                
                if (curvaCercana.tipo === 'rojo') {
                    filtroAlerta.style.backgroundColor = "rgba(211, 47, 47, 0.35)";
                    estadoEl.innerText = "Giro cerrado";
                } else if (curvaCercana.tipo === 'naranja') {
                    filtroAlerta.style.backgroundColor = "rgba(239, 108, 0, 0.35)";
                    estadoEl.innerText = "Curva pronunciada";
                } else {
                    filtroAlerta.style.backgroundColor = "rgba(46, 125, 50, 0.12)";
                    estadoEl.innerText = "Curva suave";
                }
            } else {
                filtroAlerta.style.backgroundColor = "rgba(0, 0, 0, 0)";
                flechaEl.innerText = '⬆️'; 
                distanciaEl.innerText = "Ruta limpia";
                estadoEl.innerText = "Sigue la carretera";
            }
        }

        function errorGPS() { estadoEl.innerText = "Buscando señal GPS..."; }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const phi1 = lat1 * Math.PI / 180; const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180; const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) + Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        window.onload = () => {
            inicializarMapa();
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(actualizarPosicion, errorGPS, {
                    enableHighAccuracy: true, maximumAge: 0, timeout: 2000
                });
            }
        };
    </script>
</body>
</html>
