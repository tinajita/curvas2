<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MotoNav Dashboard Pro</title>
    
    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            height: 100%;
            background-color: #050505;
            color: #fff;
            overflow: hidden;
        }

        #navigator-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 1;
        }

        /* CAPA DE INTERFAZ GENERAL */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        /* BUSCADOR INICIAL */
        #search-block {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #222;
            border-bottom: 3px solid #00ff66;
            padding: 12px;
            border-radius: 20px;
            pointer-events: auto;
            box-shadow: 0 6px 30px rgba(0,0,0,0.7);
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        #destination-input {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 14px 18px;
            font-size: 16px;
            border-radius: 25px;
            outline: none;
        }
        #destination-input:focus { border-color: #00ff66; }

        .btn-action {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 0 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* ==========================================
           ZONA SUPERIOR (HUD DE CURVAS - 1/4 DE PANTALLA)
           ========================================== */
        #hud-top-curves {
            display: none; /* Se activa en ruta */
            width: 100%;
            height: 22vh; /* Ocupa cerca de un cuarto de pantalla */
            background: linear-gradient(to bottom, rgba(10,10,10,0.95) 75%, rgba(10,10,10,0));
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 10px 20px;
        }

        #hud-curve-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.6));
        }

        #hud-curve-distance {
            font-size: 65px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.9);
        }

        /* BOTÓN FLOTANTE RECENTRAR */
        #recenter-container {
            position: absolute;
            top: 25vh;
            right: 15px;
            display: none;
            pointer-events: auto;
        }
        .btn-recenter {
            background: #00e5ff;
            color: #000;
            border: none;
            padding: 10px 18px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* ==========================================
           INTERFAZ INFERIOR (PILOTO PRO)
           ========================================== */
        #hud-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding-bottom: 10px;
        }

        /* BLOQUE IZQUIERDO: VELOCIDAD + DATOS TOTALES RUTA */
        #panel-left-telemetry {
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }

        .speed-pill {
            display: flex;
            align-items: baseline;
            background: rgba(10, 10, 10, 0.9);
            padding: 8px 22px;
            border-radius: 22px;
            border: 1px solid #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            width: fit-content;
        }
        #speed-value {
            font-size: 45px;
            font-weight: 900;
            color: #00ff66;
            line-height: 1;
        }
        .speed-unit {
            font-size: 13px;
            color: #777;
            margin-left: 6px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Píldora de Destino final (Ubicada abajo a la izquierda) */
        #trip-totals-pill {
            display: none; /* Activo en ruta */
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #222;
            padding: 8px 16px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-weight: bold;
            font-size: 15px;
            color: #fff;
            gap: 10px;
        }
        #trip-totals-pill span { color: #00ff66; font-weight: 800; }

        /* BLOQUE DERECHO: PRÓXIMA CALLE / DIRECCIÓN (REMPLAZA SATÉLITE) */
        #panel-right-street {
            display: none; /* Activo en ruta */
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            pointer-events: auto;
            max-width: 45%;
        }

        .street-pill {
            background: rgba(15, 15, 15, 0.92);
            border: 1px solid #00e5ff;
            padding: 10px 16px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #next-street-name {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            text-align: right;
            letter-spacing: 0.3px;
        }

        .btn-close-route {
            background: #ff3d00;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        /* MARCADOR MOTO */
        .nav-arrow-marker {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0px 5px 8px rgba(0,0,0,0.8));
        }
    </style>
</head>
<body>

    <div id="navigator-container">
        <div id="map"></div>

        <div id="ui-overlay">
            
            <div id="search-block">
                <input type="text" id="destination-input" placeholder="¿A dónde vamos con la moto?...">
                <button class="btn-action" onclick="fijarRutaDestino()">Ir</button>
            </div>

            <div id="hud-top-curves">
                <div id="hud-curve-arrow">
                    </div>
                <div id="hud-curve-distance">-- m</div>
            </div>

            <div id="recenter-container">
                <button class="btn-recenter" onclick="recenterManual()">✕ Recentrar</button>
            </div>

            <div id="hud-bottom-row">
                
                <div id="panel-left-telemetry">
                    <div class="speed-pill">
                        <span id="speed-value">0</span>
                        <span class="speed-unit">km/h</span>
                    </div>
                    <div id="trip-totals-pill">
                        <div id="total-distance-display">-- KM</div>
                        <div style="color: #444;">|</div>
                        <div id="total-time-display">-- MIN</div>
                    </div>
                </div>

                <div id="panel-right-street">
                    <div class="street-pill">
                        <span id="next-street-name">Detectando vía...</span>
                        <button class="btn-close-route" onclick="cancelarRuta()">✕</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>

    <script>
        let map;
        let arrowMarker;
        let miPosicion = [-4.4214, 36.7213]; // Málaga base
        let destinoCoors = null;
        let lastValidBearing = 0;
        
        let mapaDesplazadoPorUsuario = false;
        let autoRecenterTimer = null;
        let rutaActiva = false;

        const MAP_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
        
        // Ajustamos el offset para que la flecha quede libre y centrada en el tercio inferior libre
        const getCenterOffset = () => [0, window.innerHeight * 0.20]; 

        // Iconos de curva vectoriales limpios de alto impacto visual
        const SVGS_CURVA = {
            izq: `<svg width="85" height="85" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`,
            der: `<svg width="85" height="85" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`,
            recto: `<svg width="85" height="85" viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`
        };

        // LÓGICA ESTRICTA DE TRAMOS DE DISTANCIA (MÁXIMO Y MÍNIMO DE NÚMEROS)
        function cuantificarMetrosCurva(metros) {
            if (metros <= 25) return "25 m";
            if (metros <= 50) return "50 m";
            if (metros <= 100) return "100 m";
            if (metros <= 150) return "150 m";
            
            // Por encima de 150m, reduce en tramos limpios redondeados de 50m
            return (Math.round(metros / 50) * 50) + " m";
        }

        function initNavigator() {
            map = new maplibregl.Map({
                container: 'map',
                style: MAP_STYLE,
                center: miPosicion, 
                zoom: 16.8,                 
                pitch: 62,                 
                bearing: 0,
                attributionControl: false
            });

            map.on('load', () => {
                configurarCapasRuta();
                crearIconoNavegacion();
                arrancarSeguimientoGPS();
                configurarEventosGestos();
                setTimeout(() => { recenterManual(); }, 300);
            });
        }

        function configurarEventosGestos() {
            map.on('dragstart', () => {
                mapaDesplazadoPorUsuario = true;
                document.getElementById('recenter-container').style.display = 'block';
                clearTimeout(autoRecenterTimer);
            });
            map.on('dragend', () => { clearTimeout(autoRecenterTimer); autoRecenterTimer = setTimeout(recenterManual, 6000); });
        }

        function recenterManual() {
            mapaDesplazadoPorUsuario = false;
            document.getElementById('recenter-container').style.display = 'none';
            clearTimeout(autoRecenterTimer);
            
            map.easeTo({
                center: miPosicion,
                zoom: 16.8,
                bearing: lastValidBearing,
                pitch: 62,
                offset: getCenterOffset(),
                duration: 600
            });
        }

        function configurarCapasRuta() {
            map.addSource('route-source', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addLayer({
                id: 'route-casing', type: 'line', source: 'route-source',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#000000', 'line-width': 16, 'line-opacity': 0.85 }
            });
            map.addLayer({
                id: 'route-core', type: 'line', source: 'route-source',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#00ff66', 'line-width': 8, 'line-opacity': 0.95 }
            });
        }

        function crearIconoNavegacion() {
            const container = document.createElement('div');
            container.className = 'nav-arrow-marker';
            container.innerHTML = `
                <svg width="45" height="45" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5L90 90L50 70L10 90L50 5Z" fill="#ffffff" stroke="#00e5ff" stroke-width="6" stroke-linejoin="round"/>
                </svg>
            `;
            arrowMarker = new maplibregl.Marker({ element: container }).setLngLat(miPosicion).addTo(map);
        }

        async function fijarRutaDestino() {
            const query = document.getElementById('destination-input').value;
            if (!query) return;

            try {
                const searchResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const searchData = await searchResponse.json();
                if (searchData.length === 0) return;

                destinoCoors = [parseFloat(searchData[0].lon), parseFloat(searchData[0].lat)];
                rutaActiva = true;

                // CAMBIO ESTRUCTURAL DE INTERFAZ
                document.getElementById('search-block').style.display = 'none';
                document.getElementById('hud-top-curves').style.display = 'flex';
                document.getElementById('trip-totals-pill').style.display = 'flex';
                document.getElementById('panel-right-street').style.display = 'flex';

                actualizarRutaEnMarcha();
                recenterManual();

            } catch (error) {
                console.error(error);
            }
        }

        async function actualizarRutaEnMarcha() {
            if (!rutaActiva || !destinoCoors) return;

            try {
                const routeResponse = await fetch(`https://router.project-osrm.org/route/v1/driving/${miPosicion[0]},${miPosicion[1]};${destinoCoors[0]},${destinoCoors[1]}?overview=full&geometries=geojson&steps=true`);
                const routeData = await routeResponse.json();
                
                if (!routeData.routes || routeData.routes.length === 0) return;

                const dataRuta = routeData.routes[0];

                // 1. Dibujar trazo en mapa
                map.getSource('route-source').setData({
                    type: 'FeatureCollection',
                    features: [{ type: 'Feature', geometry: dataRuta.geometry, properties: {} }]
                });

                // 2. Telemetría Abajo-Izquierda: Totales de Destino
                const kms = (dataRuta.distance / 1000).toFixed(1);
                document.getElementById('total-distance-display').innerHTML = `<span>${kms}</span> KM`;

                const totalMinutos = Math.round(dataRuta.duration / 60);
                if (totalMinutos >= 60) {
                    document.getElementById('total-time-display').innerHTML = `<span>${Math.floor(totalMinutos / 60)}h ${totalMinutos % 60}m</span>`;
                } else {
                    document.getElementById('total-time-display').innerHTML = `<span>${totalMinutos}</span> MIN`;
                }

                // 3. Telemetría de Curva (HUD Arriba) y Dirección de Calle (Abajo-Derecha)
                const steps = dataRuta.legs[0].steps;
                if (steps && steps.length > 1) {
                    const metrosRealesGiro = Math.round(steps[0].distance); 
                    const proximoGiro = steps[1];

                    // Abajo a la derecha: El nombre limpio de la vía de destino
                    const nombreSiguienteVia = proximoGiro.name || proximoGiro.ref || "Siguiente Tramo";
                    document.getElementById('next-street-name').innerText = nombreSiguienteVia;

                    // Arriba en el HUD: Contador discretizado (Filtro estricto anti-números locos)
                    document.getElementById('hud-curve-distance').innerText = cuantificarMetrosCurva(metrosRealesGiro);

                    // Arriba en el HUD: Flecha gigante del sentido de la curva
                    const modifier = proximoGiro.maneuver.modifier || '';
                    const arrowContainer = document.getElementById('hud-curve-arrow');
                    
                    if (modifier.includes('left')) {
                        arrowContainer.innerHTML = SVGS_CURVA.izq;
                    } else if (modifier.includes('right')) {
                        arrowContainer.innerHTML = SVGS_CURVA.der;
                    } else {
                        arrowContainer.innerHTML = SVGS_CURVA.recto;
                    }
                }

            } catch (e) {
                console.error(e);
            }
        }

        function cancelarRuta() {
            rutaActiva = false;
            destinoCoors = null;
            map.getSource('route-source').setData({ type: 'FeatureCollection', features: [] });
            
            // Revertir estados visuales
            document.getElementById('hud-top-curves').style.display = 'none';
            document.getElementById('trip-totals-pill').style.display = 'none';
            document.getElementById('panel-right-street').style.display = 'none';
            document.getElementById('search-block').style.display = 'flex';
            document.getElementById('destination-input').value = '';
            
            recenterManual();
        }

        function arrancarSeguimientoGPS() {
            if (!navigator.geolocation) return;

            navigator.geolocation.watchPosition(
                (position) => {
                    const lon = position.coords.longitude;
                    const lat = position.coords.latitude;
                    const velocidad = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;
                    
                    miPosicion = [lon, lat];

                    if (position.coords.heading !== null && position.coords.heading !== undefined) {
                        lastValidBearing = position.coords.heading;
                    }

                    // Enviar velocidad al panel inferior izquierdo
                    document.getElementById('speed-value').innerText = velocidad;

                    arrowMarker.setLngLat(miPosicion);

                    const arrowElement = document.querySelector('.nav-arrow-marker');
                    if (arrowElement) {
                        arrowElement.style.transform = `rotate(${lastValidBearing}deg)`;
                    }

                    if (rutaActiva) {
                        actualizarRutaEnMarcha();
                    }

                    if (!mapaDesplazadoPorUsuario) {
                        map.easeTo({
                            center: miPosicion,
                            bearing: lastValidBearing,
                            offset: getCenterOffset(),
                            duration: 250,
                            easing: (t) => t
                        });
                    }
                },
                (err) => console.error(err),
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        window.onload = initNavigator;
    </script>
</body>
</html>
