<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MotoNav - Mapa Offline Real</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            height: 100%;
            background-color: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* Cuadro de mando superior */
        #dashboard {
            height: 80px;
            background: #111;
            border-bottom: 3px solid #ffb300;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        h1 {
            font-size: 20px;
            color: #ffb300;
            letter-spacing: 1px;
        }

        #status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            background: #00ff66;
            color: #000;
        }

        /* Zona del mapa */
        #map {
            flex: 1;
            width: 100%;
            background: #242424;
        }

        /* Banner de descarga */
        #download-banner {
            display: none;
            position: absolute;
            top: 95px;
            left: 15px;
            right: 15px;
            background: #222;
            border: 2px solid #ffb300;
            border-radius: 12px;
            padding: 15px;
            z-index: 2000;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }

        #download-banner h4 { color: #ffb300; margin-bottom: 6px; font-size: 16px; }
        #download-banner p { font-size: 13px; color: #ccc; margin-bottom: 12px; line-height: 1.4; }

        /* Controles flotantes inferiores */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(17, 17, 17, 0.95);
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }

        button {
            background: #ffb300;
            color: #111;
            border: none;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button.offline-btn { background: #ff3d00; color: white; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="dashboard">
            <h1>MOTONAV</h1>
            <div id="status-badge">Con Cobertura</div>
        </div>

        <div id="map"></div>

        <div id="download-banner">
            <h4>🗺️ Zona Detectada</h4>
            <p id="download-message"></p>
            <div style="display: flex; gap: 10px;">
                <button onclick="prepararMapaOffline()" style="background: #00ff66; color: #000; flex: 1;">Descargar Zona</button>
                <button onclick="cerrarBanner()" style="background: #444; color: #fff;">Luego</button>
            </div>
        </div>

        <div id="controls">
            <button id="btn-net" onclick="conmutarCobertura()">Simular Modo Avión</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
    <script src="https://gilesv.github.io/Leaflet.TileLayer.PouchDB/L.TileLayer.PouchDB.js"></script>

    <script>
        let map;
        let layerOffline;
        let modoOnline = true;
        let miPosicion = [36.7213, -4.4214]; // Ubicación por defecto (ej. Málaga)

        // Definición de la zona para ofrecer la descarga automáticamente
        const PROVINCIA_TARGET = {
            nombre: "Málaga",
            // Límites aproximados de la zona que se cacheará al pulsar el botón
            bbox: { latMin: 36.4, latMax: 36.9, lonMin: -5.0, lonMax: -4.0 }
        };

        function iniciarApp() {
            // 1. Inicializar el mapa centrado en nuestra ubicación actual
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(miPosicion, 11);

            // 2. Configurar la capa de mapas con soporte PouchDB (IndexedDB)
            // Usamos un estilo oscuro simplificado que prioriza carreteras principales y secundarias
            layerOffline = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 18,
                useCache: true,        // Activa el almacenamiento local de imágenes
                crossOrigin: true,     // Permite guardar las imágenes de otros servidores de forma segura
                cacheName: 'motonnav-tiles',
                cacheMaxAge: 1000 * 60 * 60 * 24 * 7 // Mantener el mapa guardado 7 días
            });

            layerOffline.addTo(map);

            // Marcador de posición actual
            L.circleMarker(miPosicion, { radius: 9, color: '#fff', fillColor: '#ffb300', fillOpacity: 1, weight: 3 }).addTo(map);

            // 3. Intentar usar el GPS real del teléfono si el usuario da permiso
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    miPosicion = [position.coords.latitude, position.coords.longitude];
                    map.setView(miPosicion, 12);
                    verificarGeofencing(miPosicion[0], miPosicion[1]);
                }, () => {
                    // Si falla el GPS real, usamos la posición por defecto para el test
                    verificarGeofencing(miPosicion[0], miPosicion[1]);
                });
            } else {
                verificarGeofencing(miPosicion[0], miPosicion[1]);
            }
        }

        // Detectar si estamos en la provincia para sugerir la descarga instantánea
        function verificarGeofencing(lat, lon) {
            if (lat >= PROVINCIA_TARGET.bbox.latMin && lat <= PROVINCIA_TARGET.bbox.latMax &&
                lon >= PROVINCIA_TARGET.bbox.lonMin && lon <= PROVINCIA_TARGET.bbox.lonMax) {
                
                document.getElementById('download-message').innerHTML = `Estás dentro de la provincia de <strong>${PROVINCIA_TARGET.nombre}</strong>. ¿Quieres descargar el mapa de carreteras de esta zona para poder navegar completamente sin cobertura?`;
                document.getElementById('download-banner').style.display = "block";
            }
        }

        // Acción del botón: Descarga y cachea de forma activa la zona visible actual en la memoria del móvil
        function prepararMapaOffline() {
            alert("Descargando mapa base... Mueve el mapa un poco por tus rutas habituales para asegurar que se guarden las curvas con máximo nivel de detalle.");
            
            // El plugin automáticamente empieza a guardar en la IndexedDB del navegador 
            // cada imagen de carretera que se carga en la pantalla.
            cerrarBanner();
        }

        function cerrarBanner() {
            document.getElementById('download-banner').style.display = "none";
        }

        // Simula lo que pasaría si entramos en un puerto de montaña sin cobertura de teléfono
        function conmutarCobertura() {
            modoOnline = !modoOnline;
            const badge = document.getElementById('status-badge');
            const btn = document.getElementById('btn-net');

            if (!modoOnline) {
                badge.innerText = "Modo Offline (Sin Cobertura)";
                badge.style.background = "#ff3d00";
                badge.style.color = "#fff";
                btn.innerText = "Recuperar Cobertura";
                btn.classList.add('offline-btn');

                // Forzamos a Leaflet a trabajar únicamente con lo que haya almacenado en la memoria interna
                // Desconectamos las peticiones externas a internet
                layerOffline.options.cacheOnly = true; 
                alert("Has entrado en zona sin cobertura. El mapa que estás viendo ahora se está sirviendo directamente desde la base de datos de tu teléfono móvil.");
            } else {
                badge.innerText = "Con Cobertura";
                badge.style.background = "#00ff66";
                badge.style.color = "#000";
                btn.innerText = "Simular Modo Avión";
                btn.classList.remove('offline-btn');

                // Volvemos a permitir que pida mapas a internet si hacen falta
                layerOffline.options.cacheOnly = false;
            }
        }

        window.onload = iniciarApp;
    </script>
</body>
</html>
