<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoNav - Selector de Zonas</title>
    
    <!-- Librería del Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            transition: background-color 0.4s ease;
            overflow: hidden;
        }

        /* Contenedor del Mapa */
        #map {
            flex-grow: 1;
            width: 100%;
            z-index: 1;
        }

        /* Panel Superior: Selector de Provincia (Flotante) */
        #panel-superior {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            width: 90%;
            max-width: 360px;
            text-align: center;
        }
        select {
            width: 100%;
            padding: 8px;
            font-size: 15px;
            border-radius: 6px;
            background: #222;
            color: white;
            border: 1px solid #444;
            margin-top: 5px;
        }

        /* Panel Central: Alerta de Curva Gigante */
        #capa-alerta {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.9);
            border-radius: 20px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(5px);
            border: 2px solid white;
            min-width: 290px;
            justify-content: center;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        #flecha {
            font-size: 70px;
            font-weight: bold;
            line-height: 1;
        }
        #datos-curva {
            display: flex;
            flex-direction: column;
        }
        #distancia {
            font-size: 28px;
            font-weight: bold;
            color: white;
        }
        #vel-max {
            font-size: 16px;
            color: #ffeb3b;
            font-weight: bold;
        }

        /* Barra de estado inferior */
        footer {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.85);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #ccc;
            white-space: nowrap;
        }
    </style>
</head>
<body id="pantalla-principal">

    <!-- Selector de zona -->
    <div id="panel-superior">
        <label style="color: #aaa; font-size: 12px; font-weight: bold;">Cargar zona con WiFi antes de salir:</label>
        <select id="selector-provincia" onchange="cambiarProvincia()">
            <option value="ninguna">--- Selecciona Provincia ---</option>
            <option value="madrid">Madrid (Cruz Verde)</option>
            <option value="asturias">Asturias (Puerto simulado)</option>
        </select>
    </div>

    <!-- Cuadro de mandos / Alerta -->
    <div id="capa-alerta">
        <div id="flecha">⬆️</div>
        <div id="datos-curva">
            <div id="distancia">Ruta limpia</div>
            <div id="vel-max">Vel. Máx: -- km/h</div>
        </div>
    </div>

    <!-- Visor de Mapa -->
    <div id="map"></div>

    <footer>
        <div id="estado">Selecciona una provincia para empezar</div>
    </footer>

    <script>
        const pantalla = document.getElementById('pantalla-principal');
        const flechaEl = document.getElementById('flecha');
        const distanciaEl = document.getElementById('distancia');
        const velMaxEl = document.getElementById('vel-max');
        const estadoEl = document.getElementById('estado');

        let mapa;
        let marcadorMoto;
        let lineaTrazadaAzul = null;

        // ======================================================================
        // BASE DE DATOS GEOGRÁFICA (Curvas de alerta + Trazada de carretera)
        // ======================================================================
        const DATOS_PROVINCIAS = {
            madrid: {
                centro: [40.59251, -4.19734],
                curvas: [
                    { lat: 40.59251, lon: -4.19734, tipo: 'rojo', direccion: '⬅️', velMax: 40 },
                    { lat: 40.59120, lon: -4.19510, tipo: 'naranja', direccion: '➡️', velMax: 60 },
                    { lat: 40.58840, lon: -4.19250, tipo: 'verde', direccion: '⬅️', velMax: 80 }
                ],
                trazada: [
                    [40.59350, -4.19850], [40.59251, -4.19734], [40.59190, -4.19600],
                    [40.59120, -4.19510], [40.58980, -4.19380], [40.58840, -4.19250], [40.58700, -4.19100]
                ]
            },
            asturias: {
                centro: [43.31210, -5.10120],
                curvas: [
                    { lat: 43.31210, lon: -5.10120, tipo: 'rojo', direccion: '➡️', velMax: 30 },
                    { lat: 43.31350, lon: -5.10280, tipo: 'naranja', direccion: '⬅️', velMax: 50 },
                    { lat: 43.31500, lon: -5.10450, tipo: 'verde', direccion: '➡️', velMax: 70 }
                ],
                trazada: [
                    [43.31100, -5.10000], [43.31210, -5.10120], [43.31290, -5.10200],
                    [43.31350, -5.10280], [43.31420, -5.10360], [43.31500, -5.10450], [43.31600, -5.10600]
                ]
            }
        };

        let curvasActivas = [];

        // INICIALIZACIÓN DEL MAPA GENERAL
        function inicializarMapa() {
            mapa = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([40.59251, -4.19734], 15); 

            // Capa de OpenStreetMap estándar
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                keepBuffer: 4 // Truco: Fuerza a mantener cargados más mapas alrededor en la memoria
            }).addTo(mapa);

            // Icono de la moto
            const iconoMoto = L.divIcon({
                html: '<span style="font-size: 26px;">🏍️</span>',
                className: 'marcador-moto',
                iconAnchor: [13, 13]
            });

            marcadorMoto = L.marker([40.59251, -4.19734], { icon: iconoMoto }).addTo(mapa);
        }

        // FUNCIÓN CLAVE: CAMBIAR DE PROVINCIA Y PINTAR LA NUEVA TRAZADA
        function cambiarProvincia() {
            const provincia = document.getElementById('selector-provincia').value;
            
            if (provincia === 'ninguna' || !DATOS_PROVINCIAS[provincia]) {
                curvasActivas = [];
                if (lineaTrazadaAzul) mapa.removeLayer(lineaTrazadaAzul);
                estadoEl.innerText = "Selecciona una provincia activa.";
                return;
            }

            const datos = DATOS_PROVINCIAS[provincia];
            curvasActivas = datos.curvas;

            // 1. Mover mapa al inicio de la nueva ruta
            mapa.setView(datos.centro, 15);
            marcadorMoto.setLatLng(datos.centro);

            // 2. Si ya había una línea azul pintada de antes, la borramos
            if (lineaTrazadaAzul) {
                mapa.removeLayer(lineaTrazadaAzul);
            }

            // 3. Pintar la nueva trazada azul en el mapa
            lineaTrazadaAzul = L.polyline(datos.trazada, {
                color: '#007bef',
                weight: 7,
                opacity: 0.85,
                lineJoin: 'round'
            }).addTo(mapa);

            estadoEl.innerText = `Zona ${provincia.toUpperCase()} lista. Mueve el mapa para guardar la caché WiFi.`;
        }

        // LÓGICA DE NAVEGACIÓN GPS EN RUTA
        function actualizarNavegacion(position) {
            if (curvasActivas.length === 0) return;

            const miLat = position.coords.latitude;
            const miLon = position.coords.longitude;

            // Mover flecha del vehículo
            marcadorMoto.setLatLng([miLat, miLon]);
            mapa.panTo([miLat, miLon]);

            let curvaCercana = null;
            let distanciaMinima = Infinity;

            // Escaneo de curvas locales
            curvasActivas.forEach(curva => {
                const dist = calcularDistancia(miLat, miLon, curva.lat, curva.lon);
                if (dist < distanciaMinima) {
                    distanciaMinima = dist;
                    curvaCercana = curva;
                }
            });

            // Disparador de Alertas (Radio de 200m)
            if (curvaCercana && distanciaMinima < 200) {
                flechaEl.innerText = curvaCercana.direccion;
                distanciaEl.innerText = `${Math.round(distanciaMinima)} m`;
                velMaxEl.innerText = `Vel. Máx: ${curvaCercana.velMax} km/h`;

                if (curvaCercana.tipo === 'rojo') pantalla.style.backgroundColor = '#d32f2f';
                else if (curvaCercana.tipo === 'naranja') pantalla.style.backgroundColor = '#ef6c00';
                else pantalla.style.backgroundColor = '#2e7d32';
                
                estadoEl.innerText = "¡Atención a la trazada!";
            } else {
                pantalla.style.backgroundColor = '#2e7d32';
                flechaEl.innerText = '⬆️';
                distanciaEl.innerText = "Ruta limpia";
                velMaxEl.innerText = "Vel. Máx: -- km/h";
                estadoEl.innerText = "Carretera despejada";
            }
        }

        function errorGPS(err) {
            estadoEl.innerText = "Buscando satélites GPS...";
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const phi1 = lat1 * Math.PI / 180; const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        window.onload = () => {
            inicializarMapa();
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(actualizarNavegacion, errorGPS, {
                    enableHighAccuracy: true, maximumAge: 0, timeout: 5000
                });
            }
        };
    </script>
</body>
</html>
