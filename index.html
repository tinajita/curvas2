<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoNav Curvas</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            transition: background-color 0.4s ease; /* Transición suave de color de fondo */
        }

        /* 1. EL MAPA (Ocupa el fondo de la pantalla) */
        #map {
            flex-grow: 1;
            width: 100%;
            z-index: 1;
        }

        /* 2. CAPA SUPERIOR: Alertas de Curva (Flecha Gigante) */
        #capa-alerta {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(5px);
            border: 2px solid white;
            min-width: 280px;
            justify-content: center;
        }
        #flecha {
            font-size: 70px;
            font-weight: bold;
            line-height: 1;
        }
        #datos-curva {
            display: flex;
            flex-direction: column;
        }
        #distancia {
            font-size: 28px;
            font-weight: bold;
            color: white;
        }
        #vel-max {
            font-size: 16px;
            color: #ffeb3b;
            font-weight: bold;
        }

        /* 3. CAPA INFERIOR: Estado del GPS */
        footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            color: #ccc;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body id="pantalla-principal">

    <div id="capa-alerta">
        <div id="flecha">⬆️</div>
        <div id="datos-curva">
            <div id="distancia">Ruta limpia</div>
            <div id="vel-max">Vel. Máx: -- km/h</div>
        </div>
    </div>

    <div id="map"></div>

    <footer>
        <div id="estado">Conectando con el GPS satelital...</div>
    </footer>

    <script>
        const pantalla = document.getElementById('pantalla-principal');
        const flechaEl = document.getElementById('flecha');
        const distanciaEl = document.getElementById('distancia');
        const velMaxEl = document.getElementById('vel-max');
        const estadoEl = document.getElementById('estado');

        let mapa;
        let marcadorMoto;

        // Base de datos de curvas con velocidad máxima recomendada incluida
        const CURVAS_PRECARGADAS = [
            { lat: 40.59251, lon: -4.19734, tipo: 'rojo', direccion: '⬅️', velMax: 40 },
            { lat: 40.59120, lon: -4.19510, tipo: 'naranja', direccion: '➡️', velMax: 60 },
            { lat: 40.58840, lon: -4.19250, tipo: 'verde', direccion: '⬅️', velMax: 80 }
        ];

        // INICIALIZAR EL MAPA NAVEGADOR
        function inicializarMapa() {
            // Centramos el mapa inicialmente en la zona de pruebas (Cruz Verde)
            mapa = L.map('map', {
                zoomControl: false, // Quitamos botones de + y - para que no molesten en la moto
                attributionControl: false
            }).setView([40.59251, -4.19734], 16); 

            // Cargamos los mapas de OpenStreetMap. 
            // NOTA PARA MODO OFFLINE: El navegador del móvil guardará estas imágenes automáticamente en caché cuando las veas la primera vez con internet.
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(mapa);

            // Creamos el icono de la moto/vehículo (usamos un emoji o coche para simplificar)
            const iconoMoto = L.divIcon({
                html: '<span style="font-size: 24px;">🏍️</span>',
                className: 'marcador-moto',
                iconAnchor: [12, 12]
            });

            marcadorMoto = L.marker([40.59251, -4.19734], { icon: iconoMoto }).addTo(mapa);
        }

        // CONTROL DE POSICIÓN EN TIEMPO REAL (GPS)
        function actualizarNavegacion(position) {
            const miLat = position.coords.latitude;
            const miLon = position.coords.longitude;

            // 1. Mover el marcador del vehículo y centrar el mapa automáticamente en tu posición
            marcadorMoto.setLatLng([miLat, miLon]);
            mapa.panTo([miLat, miLon]);

            estadoEl.innerText = `GPS Activo. Lat: ${miLat.toFixed(4)} Lon: ${miLon.toFixed(4)}`;

            // 2. Buscar curvas cercanas
            let curvaCercana = null;
            let distanciaMinima = Infinity;

            CURVAS_PRECARGADAS.forEach(curva => {
                const dist = calcularDistancia(miLat, miLon, curva.lat, curva.lon);
                if (dist < distanciaMinima) {
                    distanciaMinima = dist;
                    curvaCercana = curva;
                }
            });

            // 3. Sistema de alertas por colores, velocidad y distancias (Radio de 200 metros)
            if (curvaCercana && distanciaMinima < 200) {
                flechaEl.innerText = curvaCercana.direccion;
                distanciaEl.innerText = `${Math.round(distanciaMinima)} m`;
                velMaxEl.innerText = `Vel. Máx: ${curvaCercana.velMax} km/h`;

                // Cambiar el color de fondo de la pantalla completa según el peligro
                if (curvaCercana.tipo === 'rojo') {
                    pantalla.style.backgroundColor = '#d32f2f'; // Fondo Rojo
                } else if (curvaCercana.tipo === 'naranja') {
                    pantalla.style.backgroundColor = '#ef6c00'; // Fondo Naranja
                } else {
                    pantalla.style.backgroundColor = '#2e7d32'; // Fondo Verde
                }
            } else {
                // Todo despejado
                pantalla.style.backgroundColor = '#2e7d32'; // Verde por defecto
                flechaEl.innerText = '⬆️';
                distanciaEl.innerText = "Ruta limpia";
                velMaxEl.innerText = "Vel. Máx: -- km/h";
            }
        }

        function errorGPS(err) {
            estadoEl.innerText = "Buscando señal de satélites...";
        }

        // FÓRMULA MATEMÁTICA PARA MEDIR METROS
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const phi1 = lat1 * Math.PI / 180; const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Arrancar la aplicación al cargar la página
        window.onload = () => {
            inicializarMapa();
            
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(actualizarNavegacion, errorGPS, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                });
            } else {
                estadoEl.innerText = "Tu dispositivo no tiene GPS.";
            }
        };
    </script>
</body>
</html>
