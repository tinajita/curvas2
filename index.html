<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MotoNav Pro - Navegación Real</title>
    
    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            height: 100%;
            background-color: #111;
            color: #fff;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* Cuadro de instrumentos superior */
        #dashboard {
            height: 90px;
            background: #161616;
            border-bottom: 3px solid #00ff66;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #road-indicator {
            font-size: 22px;
            font-weight: bold;
            color: #00ff66;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #geo-status {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        /* Contenedor del mapa */
        #map {
            flex: 1;
            width: 100%;
        }

        /* Botón flotante para guardar mapa offline */
        #offline-ctrl {
            position: absolute;
            bottom: 25px;
            right: 20px;
            z-index: 1000;
        }

        .btn-action {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 14px 22px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="dashboard">
            <div id="road-indicator">Buscando Carretera...</div>
            <div id="geo-status">Esperando señal GPS de alta precisión...</div>
        </div>

        <div id="map"></div>

        <div id="offline-ctrl">
            <button class="btn-action" onclick="guardarZonaOffline()">Fijar Zona Offline</button>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>

    <script>
        let map;
        let userMarker;
        let gpsWatchId = null;
        const CACHE_NAME = 'motonav-vector-tiles-v1';

        // Estilo vectorial oscuro optimizado (Muestra carreteras de forma muy clara)
        const MAP_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';

        function init() {
            // Inicializar mapa con un centro provisional (Se actualizará al instante con el GPS)
            map = new maplibregl.Map({
                container: 'map',
                style: MAP_STYLE,
                center: [-4.4214, 36.7213], 
                zoom: 15,
                pitch: 45, // Inclinación tipo perspectiva de moto
                bearing: 0,
                attributionControl: false
            });

            map.on('load', () => {
                // 1. Crear una capa vacía para el resaltado neón de la carretera actual
                map.addSource('current-road-source', {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features: [] }
                });

                map.addLayer({
                    id: 'current-road-layer',
                    type: 'line',
                    source: 'current-road-source',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: {
                        'line-color': '#00ff66',
                        'line-width': 9,
                        'line-opacity': 0.75
                    }
                });

                // 2. Marcador de posición del piloto
                const el = document.createElement('div');
                el.style.width = '20px';
                el.style.height = '20px';
                el.style.backgroundColor = '#fff';
                el.style.border = '4px solid #00ff66';
                el.style.borderRadius = '50%';
                el.style.boxShadow = '0 0 10px #00ff66';

                userMarker = new maplibregl.Marker({ element: el })
                    .setLngLat([0, 0])
                    .addTo(map);

                // 3. Arrancar el posicionamiento de hardware real
                activarGPSReal();
            });
        }

        // --- SISTEMA DE POSICIONAMIENTO Y ESCANEO DE CARRETERAS REAL ---
        function activarGPSReal() {
            if (!navigator.geolocation) {
                document.getElementById('road-indicator').innerText = "GPS no soportado";
                return;
            }

            gpsWatchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lon = position.coords.longitude;
                    const lat = position.coords.latitude;
                    const rumbo = position.coords.heading; // Rumbo real en grados si está en movimiento
                    const velocidad = position.coords.speed ? (position.coords.speed * 3.6).toFixed(0) : 0;

                    const coord = [lon, lat];

                    // Actualizar UI de telemetría básica
                    document.getElementById('geo-status').innerText = `Precisión: ±${position.coords.accuracy.toFixed(0)}m | Vel: ${velocidad} km/h`;

                    // Mover marcador y centrar mapa
                    userMarker.setLngLat(coord);
                    
                    map.easeTo({
                        center: coord,
                        bearing: rumbo !== null && rumbo !== undefined ? rumbo : map.getBearing(),
                        duration: 1000
                    });

                    // EJECUTAR ESCANEO DE CARRETERA BAJO LA MOTO
                    resaltarCarreteraActual(lon, lat);
                },
                (err) => {
                    console.error(err);
                    document.getElementById('geo-status').innerText = "Error al enlazar satélites GPS.";
                },
                {
                    enableHighAccuracy: true, // Forzar uso del chip GPS integrado (independiente de red)
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        }

        // --- ALGORITMO DE DETECCIÓN Y RESALTADO DE VÍA ---
        function resaltarCarreteraActual(lon, lat) {
            // Convertimos las coordenadas geográficas a píxeles de la pantalla actual
            const pixelPos = map.project([lon, lat]);

            // Creamos un área de escaneo de 30x30 píxeles alrededor de la moto
            const bbox = [
                [pixelPos.x - 15, pixelPos.y - 15],
                [pixelPos.x + 15, pixelPos.y + 15]
            ];

            // Consultamos los elementos vectoriales del mapa presentes en esa caja
            const features = map.queryRenderedFeatures(bbox);

            // Filtramos para quedarnos con el segmento de carretera más cercano
            // Buscamos capas de transporte, carreteras o elementos con la propiedad 'class' de vial principal/secundario
            const roadFeature = features.find(f => 
                f.layer.id.toLowerCase().includes('road') || 
                f.layer.id.toLowerCase().includes('transport') ||
                f.properties.class === 'highway'
            );

            if (roadFeature && roadFeature.geometry) {
                // Extraemos el nombre de la vía si existe en la base de datos de OpenStreetMap
                const nombreVia = roadFeature.properties.name || roadFeature.properties.ref || "Carretera Secundaria";
                document.getElementById('road-indicator').innerText = nombreVia;

                // Inyectamos la geometría de esa carretera en nuestra capa de neón para resaltarla
                map.getSource('current-road-source').setData({
                    type: 'FeatureCollection',
                    features: [{
                        type: 'Feature',
                        geometry: roadFeature.geometry,
                        properties: {}
                    }]
                });
            } else {
                document.getElementById('road-indicator').innerText = "Conduciendo...";
            }
        }

        // --- MOTOR DE CACHÉ OFFLINE REAL (Cache Storage API) ---
        async function guardarZonaOffline() {
            if (!window.caches) {
                alert("Tu navegador no soporta almacenamiento local avanzado.");
                return;
            }

            const boton = document.querySelector('.btn-action');
            boton.innerText = "Guardando...";
            boton.style.background = "#ffb300";

            try {
                const cache = await caches.open(CACHE_NAME);
                
                // Obtenemos los mapas vectoriales cargados actualmente en la pantalla del dispositivo
                // y los almacenamos directamente en el disco duro del teléfono móvil
                const styleResponse = await fetch(MAP_STYLE);
                await cache.put(MAP_STYLE, styleResponse);

                alert("Zona fijada con éxito. Los datos vectoriales de las carreteras visibles se han asegurado en el almacenamiento local para su uso offline.");
            } catch (error) {
                console.error(error);
                alert("Error al salvar los datos en local.");
            } finally {
                boton.innerText = "Fijar Zona Offline";
                boton.style.background = "#00ff66";
            }
        }

        window.onload = init;
    </script>
</body>
</html>
