<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MotoNav Roadbook Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3069/3069170.png">
    
    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body, html { height: 100dvh; background-color: #2a2a2a; color: #fff; overflow: hidden; }
        #navigator-container { display: flex; flex-direction: column; height: 100dvh; position: relative; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* PANTALLA DE CARGA INICIAL PARA EL MAPA OFFLINE */
        #download-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2a2a2a; z-index: 9999; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        #download-bar-container { width: 80%; max-width: 300px; height: 8px; background: #444; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        #download-bar { width: 0%; height: 100%; background: #ff5500; transition: width 0.1s ease; }

        #ui-overlay { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; 
            pointer-events: none; display: flex; flex-direction: column; 
            justify-content: space-between; padding: 14px;
            padding-top: calc(env(safe-area-inset-top, 12px) + 4px);
            padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 38px);
        }

        #search-block { background: rgba(30, 30, 30, 0.95); border: 1px solid #444; border-bottom: 3px solid #ff5500; padding: 12px; border-radius: 20px; pointer-events: auto; box-shadow: 0 6px 30px rgba(0,0,0,0.8); display: flex; gap: 10px; margin-top: 10px; }
        #destination-input { flex: 1; background: #252525; border: 1px solid #555; color: #fff; padding: 14px 18px; font-size: 16px; border-radius: 25px; outline: none; }
        #destination-input:focus { border-color: #ff5500; }
        .btn-action { background: #ff5500; color: #fff; border: none; padding: 0 25px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; }

        #hud-top-danger-meter {
            width: 100%; height: 22vh;
            background: linear-gradient(to bottom, rgba(30,30,30,0.98) 65%, rgba(20,20,20,0.4) 85%, rgba(0,0,0,0));
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 20px; transition: background 0.2s ease; border-radius: 0 0 22px 22px;
        }

        #danger-chevrons-container { display: flex; align-items: center; justify-content: center; gap: 8px; height: 70px; }
        .danger-chevron { width: 52px; height: 70px; filter: drop-shadow(0 0 12px rgba(0,0,0,0.9)); }
        #hud-curve-distance { font-size: 56px; font-weight: 900; color: #ffffff; letter-spacing: -2px; line-height: 1; text-shadow: 0 4px 12px rgba(0,0,0,1); }

        #recenter-container { position: absolute; top: 25vh; right: 15px; display: none; pointer-events: auto; }
        .btn-recenter { background: #ff5500; color: #fff; border: none; padding: 10px 18px; font-size: 12px; font-weight: bold; border-radius: 20px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        #hud-bottom-row { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }

        #panel-left-telemetry { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .speed-pill { display: flex; align-items: baseline; background: rgba(30, 30, 30, 0.95); padding: 10px 24px; border-radius: 22px; border: 1px solid #444; box-shadow: 0 6px 20px rgba(0,0,0,0.8); width: fit-content; }
        #speed-value { font-size: 46px; font-weight: 900; color: #ff5500; line-height: 1; }
        .speed-unit { font-size: 13px; color: #aaa; margin-left: 6px; font-weight: bold; text-transform: uppercase; }

        #trip-totals-pill { display: none; background: rgba(30, 30, 30, 0.95); border: 1px solid #444; padding: 10px 18px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.7); font-weight: bold; font-size: 16px; color: #fff; gap: 12px; }
        #trip-totals-pill span { color: #ff5500; font-weight: 900; }

        #panel-right-street { display: none; flex-direction: column; align-items: flex-end; pointer-events: auto; max-width: 48%; }
        .street-pill { background: rgba(30, 30, 30, 0.95); border: 2px solid #ff5500; padding: 12px 18px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 12px; }
        #next-street-name { font-size: 15px; font-weight: 800; color: #ffffff; text-transform: uppercase; text-align: right; letter-spacing: 0.4px; }
        .btn-close-route { background: #ff3d00; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .nav-arrow-marker { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.9)); }
        #gps-alert-banner { position: absolute; top: 20px; left: 20px; right: 20px; background: #ff3d00; color: white; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; z-index: 999; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: auto; }

        @media (orientation: landscape) {
            #ui-overlay { padding-top: env(safe-area-inset-top, 4px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); }
            #hud-top-danger-meter { height: 52px; flex-direction: row; justify-content: space-between; padding: 0 40px; border-radius: 0 0 14px 14px; }
            #danger-chevrons-container { height: 38px; gap: 12px; }
            .danger-chevron { width: 26px; height: 38px; }
            #hud-curve-distance { font-size: 34px; }
            #recenter-container { top: 65px; }
            #hud-bottom-row { align-items: center; }
            #panel-left-telemetry { flex-direction: row; align-items: center; gap: 12px; }
            .speed-pill { padding: 6px 16px; }
            #speed-value { font-size: 32px; }
            #trip-totals-pill { padding: 8px 14px; font-size: 14px; }
            .street-pill { padding: 8px 14px; }
            #next-street-name { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="download-overlay">
        <h2 style="color: #fff; margin-bottom: 8px; font-weight: 800; text-align: center; letter-spacing: 0.5px;">PREPARANDO MAPA OFFLINE</h2>
        <p style="color: #aaa; font-size: 13px; margin-bottom: 22px; text-align: center; max-width: 290px; line-height: 1.4;">Guardando curvas de nivel en el almacenamiento del dispositivo para rodar sin cobertura en la sierra.</p>
        <div id="download-bar-container">
            <div id="download-bar"></div>
        </div>
        <div id="download-progress" style="color: #ff5500; font-weight: 900; font-size: 20px;">0%</div>
    </div>

    <div id="gps-alert-banner" onclick="this.style.display='none'">
        ⚠️ GPS sin precisión. Si usas Chrome en iOS, ve a Ajustes -> Chrome -> Localización -> Activa "Ubicación exacta".
    </div>

    <div id="navigator-container">
        <div id="map"></div>

        <div id="ui-overlay">
            <div id="search-block">
                <input type="text" id="destination-input" placeholder="¿A dónde vamos con la moto?...">
                <button class="btn-action" onclick="fijarRutaDestino()">Ir</button>
            </div>

            <div id="hud-top-danger-meter">
                <div id="danger-chevrons-container"></div>
                <div id="hud-curve-distance">-- m</div>
            </div>

            <div id="recenter-container">
                <button class="btn-recenter" onclick="recenterManual()">✕ Recentrar</button>
            </div>

            <div id="hud-bottom-row">
                <div id="panel-left-telemetry">
                    <div class="speed-pill">
                        <span id="speed-value">0</span>
                        <span class="speed-unit">km/h</span>
                    </div>
                    <div id="trip-totals-pill">
                        <div id="total-distance-display">-- KM</div>
                        <div style="color: #444;">|</div>
                        <div id="total-time-display">-- MIN</div>
                    </div>
                </div>
                
                <div id="panel-right-street">
                    <div class="street-pill">
                        <span id="next-street-name">Ruta</span>
                        <button class="btn-close-route" onclick="cancelarRuta()">✕</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>

    <script>
        const PMTILES_URL = 'https://files.catbox.moe/6qd0nz.pmtiles';
        
        let map;
        let arrowMarker;
        let miPosicion = [-4.4214, 36.7213]; // Málaga base
        let destinoCoors = null;
        let lastValidBearing = 0;
        let mapaDesplazadoPorUsuario = false;
        let autoRecenterTimer = null;
        let rutaActiva = false;

        const getCenterOffset = () => [0, window.innerHeight * (window.innerHeight > window.innerWidth ? 0.16 : 0.04)];

        const CONFIG_PELIGRO = {
            low: { color: '#00ff66', paneles: 1, fondo: 'linear-gradient(to bottom, rgba(30, 50, 35, 0.98) 65%, rgba(15, 25, 15, 0.3) 85%, rgba(0,0,0,0))' },
            medium: { color: '#ffb300', paneles: 2, fondo: 'linear-gradient(to bottom, rgba(80, 48, 0, 0.98) 65%, rgba(20, 12, 0, 0.3) 85%, rgba(0,0,0,0))' },
            high: { color: '#ff3d00', paneles: 3, fondo: 'linear-gradient(to bottom, rgba(120, 6, 6, 0.98) 65%, rgba(35, 2, 2, 0.3) 85%, rgba(0,0,0,0))' }
        };

        // --- NUEVOS ICONOS EN SVG PARA EL HUD ---
        const ICONOS_HUD = {
            rotonda: `<svg class="danger-chevron" viewBox="0 0 24 24" fill="none" stroke="#ffb300" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:60px; height:60px;"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M4 12h4M16 12h4"/></svg>`,
            cruce: `<svg class="danger-chevron" viewBox="0 0 24 24" fill="none" stroke="#ffb300" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:55px; height:55px;"><path d="M12 2v20M2 12h20"/></svg>`,
            autovia: `<svg class="danger-chevron" viewBox="0 0 24 24" fill="none" stroke="#00aaff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:65px; height:65px;"><path d="M7 2v20M17 2v20M3 12h6M15 12h6"/></svg>`
        };

        // Escalonado estricto de metros por debajo de 400 m
        function cuantificarMetrosCurva(metros) {
            if (metros <= 20) return "0 m";
            if (metros <= 35) return "25 m";
            if (metros <= 75) return "50 m";
            if (metros <= 150) return "100 m";
            return (Math.round(metros / 100) * 100) + " m";
        }

        function renderizarHUDPeligro(direccion, peligrosidad, tipoManiobra, esAutovia) {
            const hudTop = document.getElementById('hud-top-danger-meter');
            const container = document.getElementById('danger-chevrons-container');
            container.innerHTML = ''; 

            // CASO 1: Es autovía/vía rápida -> Símbolo azul de autovía (modo tranquilo)
            if (esAutovia && peligrosidad !== 'high') {
                hudTop.style.background = 'linear-gradient(to bottom, rgba(20, 40, 60, 0.98) 65%, rgba(10, 20, 30, 0.3) 85%, rgba(0,0,0,0))';
                container.innerHTML = ICONOS_HUD.autovia;
                return;
            }

            // CASO 2: Rotondas
            if (tipoManiobra.includes('roundabout') || tipoManiobra.includes('rotary')) {
                hudTop.style.background = 'linear-gradient(to bottom, rgba(50, 45, 20, 0.98) 65%, rgba(25, 20, 10, 0.3) 85%, rgba(0,0,0,0))';
                container.innerHTML = ICONOS_HUD.rotonda;
                return;
            }

            // CASO 3: Cruces directos (intersecciones)
            if (tipoManiobra === 'intersection') {
                hudTop.style.background = 'linear-gradient(to bottom, rgba(40, 40, 40, 0.98) 65%, rgba(20, 20, 20, 0.3) 85%, rgba(0,0,0,0))';
                container.innerHTML = ICONOS_HUD.cruce;
                return;
            }

            // CASO 4: Curva convencional en carretera secundaria (Chevrones originales)
            const config = CONFIG_PELIGRO[peligrosidad] || CONFIG_PELIGRO.low;
            hudTop.style.background = config.fondo;

            const scaleX = (direccion === 'izq') ? -1 : 1;
            const svgChevron = `<svg class="danger-chevron" style="transform: scaleX(${scaleX});" viewBox="0 0 24 24" fill="none"><path d="M10 5L17 12L10 19" stroke="${config.color}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

            for (let i = 0; i < config.paneles; i++) { 
                container.innerHTML += svgChevron; 
            }
        }

        async function initNavigator() {
            const nombreCache = 'motonav-map-store';
            let mapaCompletoBlob = null;

            try {
                const cache = await caches.open(nombreCache);
                const respuestaGuardada = await cache.match(PMTILES_URL);

                if (respuestaGuardada) {
                    console.log("Mapa extraído con éxito de la caché local.");
                    mapaCompletoBlob = await respuestaGuardada.blob();
                } else {
                    document.getElementById('download-overlay').style.display = 'flex';
                    
                    const respuestaEnDirecto = await fetch(PMTILES_URL);
                    if (!respuestaEnDirecto.ok) throw new Error("Fallo de red al descargar el mapa");

                    const tamanoTotal = parseInt(respuestaEnDirecto.headers.get('content-length') || '0', 10);
                    const lector = respuestaEnDirecto.body.getReader();
                    
                    let bytesDescargados = 0;
                    const fragmentos = [];

                    while(true) {
                        const {done, value} = await lector.read();
                        if (done) break;
                        fragmentos.push(value);
                        bytesDescargados += value.length;
                        
                        if (tamanoTotal > 0) {
                            const porcentaje = Math.round((bytesDescargados / tamanoTotal) * 100);
                            document.getElementById('download-bar').style.width = porcentaje + '%';
                            document.getElementById('download-progress').innerText = porcentaje + '%';
                        }
                    }

                    mapaCompletoBlob = new Blob(fragmentos);
                    const clonParaGuardar = new Response(mapaCompletoBlob, { headers: { 'Content-Type': 'application/octet-stream' } });
                    await cache.put(PMTILES_URL, clonParaGuardar);
                    document.getElementById('download-overlay').style.display = 'none';
                }
            } catch (error) {
                console.error("Error gestionando el mapa offline:", error);
                document.getElementById('download-overlay').style.display = 'none';
            }

            const protocol = new pmtiles.Protocol();
            maplibregl.addProtocol("pmtiles", protocol.tile);

            let urlIdentificador = PMTILES_URL;

            if (mapaCompletoBlob) {
                const fuenteLocal = {
                    getKey: () => "mapa-sierra-local",
                    getBytes: async (offset, length) => {
                        const corte = mapaCompletoBlob.slice(offset, offset + length);
                        const buffer = await corte.arrayBuffer();
                        return { data: buffer };
                    }
                };
                const p = new pmtiles.PMTiles(fuenteLocal);
                protocol.add(p);
                urlIdentificador = "mapa-sierra-local";
            } else {
                const p = new pmtiles.PMTiles(PMTILES_URL);
                protocol.add(p);
            }

            const ESTILO_MINIMALISTA_OFFLINE = {
                "version": 8,
                "sources": {
                    "mapa-curvas-source": {
                        "type": "vector",
                        "url": "pmtiles://" + urlIdentificador,
                        "attribution": "© OpenStreetMap"
                    }
                },
                "layers": [
                    {
                        "id": "fondo-oscuro",
                        "type": "background",
                        "paint": { "background-color": "#2a2a2a" }
                    },
                    {
                        "id": "carreteras-base",
                        "type": "line",
                        "source": "mapa-curvas-source",
                        "source-layer": "transportation", 
                        "layout": { "line-join": "round", "line-cap": "round" },
                        "paint": { "line-color": "#444444", "line-width": 2 }
                    },
                    {
                        "id": "curvas-nivel",
                        "type": "line",
                        "source": "mapa-curvas-source",
                        "source-layer": "contour", 
                        "paint": { "line-color": "#555555", "line-width": 0.8, "line-opacity": 0.6 }
                    }
                ]
            };

            map = new maplibregl.Map({ 
                container: 'map', 
                style: ESTILO_MINIMALISTA_OFFLINE, 
                center: miPosicion, 
                zoom: 15.5, 
                pitch: 62, 
                bearing: 0, 
                attributionControl: false 
            });

            map.on('load', () => { 
                configurarCapasRuta(); 
                crearIconoNavegacion(); 
                arrancarSeguimientoGPS(); 
                configurarEventosGestos(); 
                
                const destinoGuardado = localStorage.getItem('destinoMoto');
                const coorsGuardadas = localStorage.getItem('coorsMoto');
                if (destinoGuardado && coorsGuardadas) {
                    document.getElementById('destination-input').value = destinoGuardado;
                    destinoCoors = JSON.parse(coorsGuardadas);
                    rutaActiva = true;
                    
                    document.getElementById('search-block').style.display = 'none';
                    document.getElementById('hud-top-danger-meter').style.display = 'flex';
                    document.getElementById('trip-totals-pill').style.display = 'flex';
                    document.getElementById('panel-right-street').style.display = 'flex';
                    
                    const geometriaGuardada = localStorage.getItem('geometriaRutaMoto');
                    if (geometriaGuardada) {
                        map.getSource('route-source').setData({ 
                            type: 'FeatureCollection', 
                            features: [{ type: 'Feature', geometry: JSON.parse(geometriaGuardada), properties: {} }] 
                        });
                    }
                    actualizarRutaEnMarcha();
                }
                setTimeout(recenterManual, 300); 
            });
            window.addEventListener('resize', () => { if (map) map.setOffset(getCenterOffset()); });
        }

        function configurarEventosGestos() {
            map.on('dragstart', () => { mapaDesplazadoPorUsuario = true; document.getElementById('recenter-container').style.display = 'block'; clearTimeout(autoRecenterTimer); });
            map.on('dragend', () => { clearTimeout(autoRecenterTimer); autoRecenterTimer = setTimeout(recenterManual, 6000); });
        }

        function recenterManual() {
            mapaDesplazadoPorUsuario = false;
            document.getElementById('recenter-container').style.display = 'none';
            clearTimeout(autoRecenterTimer);
            map.easeTo({ center: miPosicion, zoom: 15.5, bearing: lastValidBearing, pitch: 62, offset: getCenterOffset(), duration: 600 });
        }

        function configurarCapasRuta() {
            map.addSource('route-source', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addLayer({ id: 'route-casing', type: 'line', source: 'route-source', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#000000', 'line-width': 16, 'line-opacity': 0.85 } });
            map.addLayer({ id: 'route-core', type: 'line', source: 'route-source', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#ff5500', 'line-width': 8, 'line-opacity': 0.95 } });
        }

        function crearIconoNavegacion() {
            const container = document.createElement('div');
            container.className = 'nav-arrow-marker';
            container.innerHTML = `<svg width="45" height="45" viewBox="0 0 100 100" fill="none"><path d="M50 5L90 90L50 70L10 90L50 5Z" fill="#ffffff" stroke="#ff5500" stroke-width="6" stroke-linejoin="round"/></svg>`;
            arrowMarker = new maplibregl.Marker({ element: container }).setLngLat(miPosicion).addTo(map);
        }

        async function fijarRutaDestino() {
            const query = document.getElementById('destination-input').value;
            if (!query) return;
            try {
                const searchResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const searchData = await searchResponse.json();
                if (searchData.length === 0) return;
                destinoCoors = [parseFloat(searchData[0].lon), parseFloat(searchData[0].lat)];
                rutaActiva = true;
                
                localStorage.setItem('destinoMoto', query);
                localStorage.setItem('coorsMoto', JSON.stringify(destinoCoors));
                
                document.getElementById('search-block').style.display = 'none';
                document.getElementById('hud-top-danger-meter').style.display = 'flex';
                document.getElementById('trip-totals-pill').style.display = 'flex';
                document.getElementById('panel-right-street').style.display = 'flex';
                
                actualizarRutaEnMarcha();
                recenterManual();
            } catch (error) { console.error(error); }
        }

        async function actualizarRutaEnMarcha() {
            if (!rutaActiva || !destinoCoors) return;
            
            if (!navigator.onLine) {
                console.warn("Navegación en Modo Aislado sin red: Usando datos de ruta estáticos.");
                return;
            }

            try {
                const routeResponse = await fetch(`https://router.project-osrm.org/route/v1/driving/${miPosicion[0]},${miPosicion[1]};${destinoCoors[0]},${destinoCoors[1]}?overview=full&geometries=geojson&steps=true`);
                const routeData = await routeResponse.json();
                if (!routeData.routes || routeData.routes.length === 0) return;
                const dataRuta = routeData.routes[0];
                
                localStorage.setItem('geometriaRutaMoto', JSON.stringify(dataRuta.geometry));
                map.getSource('route-source').setData({ type: 'FeatureCollection', features: [{ type: 'Feature', geometry: dataRuta.geometry, properties: {} }] });
                
                const kms = (dataRuta.distance / 1000).toFixed(1);
                document.getElementById('total-distance-display').innerHTML = `<span>${kms}</span> KM`;
                const totalMinutos = Math.round(dataRuta.duration / 60);
                if (totalMinutos >= 60) { document.getElementById('total-time-display').innerHTML = `<span>${Math.floor(totalMinutos / 60)}h ${totalMinutos % 60}m</span>`; } else { document.getElementById('total-time-display').innerHTML = `<span>${totalMinutos}</span> MIN`; }

                const steps = dataRuta.legs[0].steps;
                if (steps && steps.length > 0) {
                    const metrosRealesGiro = Math.round(steps[0].distance);
                    
                    // PASO CRÍTICO: Si estamos a menos de 20 metros, OSRM salta de paso para no cambiar de forma anticipada
                    let pasoActual = steps[0];
                    let proximoGiro = steps[1] || steps[0];
                    
                    if (metrosRealesGiro <= 20 && steps.length > 1) {
                        pasoActual = steps[1];
                        proximoGiro = steps[2] || steps[1];
                    }

                    const calleActualInfo = pasoActual.name || pasoActual.ref || "";
                    const proximaCalleInfo = proximoGiro.name || proximoGiro.ref || "";
                    
                    // Filtrado de Autovías/Autopistas
                    const esAutovia = /A-\d|AP-\d|Autovía|Autopista/i.test(calleActualInfo) || /A-\d|AP-\d|Autovía|Autopista/i.test(proximaCalleInfo);

                    document.getElementById('next-street-name').innerText = proximaCalleInfo || "Tramo Continuo";

                    // REGLA FILTRO DE DISTANCIA: Ocultar si está a más de 400 m
                    const hudTop = document.getElementById('hud-top-danger-meter');
                    if (metrosRealesGiro > 400) {
                        hudTop.style.display = 'none';
                    } else {
                        hudTop.style.display = 'flex';
                        document.getElementById('hud-curve-distance').innerText = cuantificarMetrosCurva(metrosRealesGiro);

                        const modifier = proximoGiro.maneuver.modifier || '';
                        let direccion = 'recto';
                        if (modifier.includes('left')) direccion = 'izq';
                        if (modifier.includes('right')) direccion = 'der';

                        let peligrosidad = 'low'; 
                        const maneuverType = proximoGiro.maneuver.type;

                        if (motos_danger_types_medium.includes(maneuverType) || motos_danger_modifiers_medium.includes(modifier)) { 
                            peligrosidad = 'medium'; 
                        }
                        if (motos_danger_modifiers_high.includes(modifier)) { 
                            peligrosidad = 'high'; 
                        }

                        renderizarHUDPeligro(direccion, peligrosidad, maneuverType, esAutovia);
                    }
                }
            } catch (e) { console.error(e); }
        }

        const motos_danger_types_medium = ['turn', 'on ramp'];
        const motos_danger_modifiers_medium = ['slight left', 'slight right', 'left', 'right'];
        const motos_danger_modifiers_high = ['sharp left', 'sharp right', 'uturn'];

        function cancelarRuta() { 
            rutaActiva = false; 
            destinoCoors = null; 
            localStorage.removeItem('destinoMoto');
            localStorage.removeItem('coorsMoto');
            localStorage.removeItem('geometriaRutaMoto');
            map.getSource('route-source').setData({ type: 'FeatureCollection', features: [] }); 
            document.getElementById('hud-top-danger-meter').style.display = 'none'; 
            document.getElementById('trip-totals-pill').style.display = 'none'; 
            document.getElementById('panel-right-street').style.display = 'none'; 
            document.getElementById('search-block').style.display = 'flex'; 
            document.getElementById('destination-input').value = ''; 
            recenterManual(); 
        }

        function arrancarSeguimientoGPS() {
            if (!navigator.geolocation) return;
            
            navigator.geolocation.watchPosition((position) => {
                document.getElementById('gps-alert-banner').style.display = 'none';

                const lon = position.coords.longitude;
                const lat = position.coords.latitude;
                const velocidad = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;
                
                miPosicion = [lon, lat];
                if (position.coords.heading !== null && position.coords.heading !== undefined) { lastValidBearing = position.coords.heading; }
                
                document.getElementById('speed-value').innerText = velocidad;
                arrowMarker.setLngLat(miPosicion);
                
                const arrowElement = document.querySelector('.nav-arrow-marker');
                if (arrowElement) { arrowElement.style.transform = `rotate(${lastValidBearing}deg)`; }
                if (rutaActiva) { actualizarRutaEnMarcha(); }
                
                if (!mapaDesplazadoPorUsuario) { 
                    map.easeTo({ center: miPosicion, bearing: lastValidBearing, offset: getCenterOffset(), duration: 280, easing: (t) => t }); 
                }
            }, (err) => {
                console.error("Error GPS:", err);
                document.getElementById('gps-alert-banner').style.display = 'block';
            }, { 
                enableHighAccuracy: true, 
                maximumAge: 3000,  
                timeout: 15000     
            });
        }

        // Control de WakeLock (Pantalla encendida)
        if ('wakeLock' in navigator) {
            let wakeLockInstance = null;
            const requestWakeLock = async () => {
                try {
                    wakeLockInstance = await navigator.wakeLock.request('screen');
                } catch (err) { console.error('Error al bloquear reposición de pantalla:', err); }
            };
            document.addEventListener('visibilitychange', () => {
                if (wakeLockInstance !== null && document.visibilityState === 'visible') { requestWakeLock(); }
            });
            requestWakeLock();
        }

        window.onload = initNavigator;

        // Registro de Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Sistema offline activado con éxito."))
                .catch(err => console.error("Error activando offline:", err));
        }
    </script>
</body>
</html>
