<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCurvas OSM Offline Completo</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            overflow: hidden;
        }

        /* Contenedor del Mapa (Ocupa toda la pantalla de fondo) */
        #map {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* CAPA DE COLOR CRUCIAL: Filtro translúcido sobre el mapa para dar la alerta sin taparlo */
        #filtro-alerta {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none; /* Permite que sigas pudiendo tocar el mapa */
            background-color: rgba(46, 125, 50, 0.25); /* Verde suave por defecto */
            transition: background-color 0.3s ease;
        }

        /* Panel Superior para usar EN CASA (WiFi) */
        #config-casa {
            position: absolute;
            top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.9);
            padding: 15px; border-radius: 12px;
            width: 90%; max-width: 380px; text-align: center;
            border: 2px solid #007bef;
        }
        input, button {
            width: 100%; padding: 10px; margin-top: 8px;
            border-radius: 6px; border: none; font-size: 16px;
        }
        button { background: #007bef; color: white; font-weight: bold; cursor: pointer; }

        /* Cuadro de Mandos Superior (En marcha) */
        #capa-alerta {
            position: absolute;
            top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9;
            background-color: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            padding: 12px 25px;
            display: flex; align-items: center; gap: 20px;
            backdrop-filter: blur(5px);
            border: 2px solid white;
            min-width: 290px; justify-content: center;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        #flecha { font-size: 65px; font-weight: bold; line-height: 1; }
        #datos-curva { display: flex; flex-direction: column; }
        #distancia { font-size: 26px; font-weight: bold; color: white; }
        #estado { font-size: 13px; color: #ccc; }

        /* Icono de la moto en el mapa */
        .marcador-moto { text-shadow: 0px 2px 5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="filtro-alerta"></div>

    <div id="config-casa">
        <label style="color: white; font-weight: bold;">🏠 Precarga WiFi en Casa:</label>
        <input type="text" id="zona-input" value="Granada" placeholder="Ej: Granada, Madrid, Asturias...">
        <button onclick="descargarYProcesarZona()">📥 Descargar Mapa y Curvas</button>
    </div>

    <div id="capa-alerta">
        <div id="flecha">⬆️</div>
        <div id="datos-curva">
            <div id="distancia">App Lista</div>
            <div id="estado">Introduce zona con WiFi</div>
        </div>
    </div>

    <script>
        const filtroAlerta = document.getElementById('filtro-alerta');
        const flechaEl = document.getElementById('flecha');
        const distanciaEl = document.getElementById('distancia');
        const estadoEl = document.getElementById('estado');

        let mapa;
        let marcadorMoto;
        let curvasZonaOffline = [];

        // 1. INICIALIZAR MAPA DE OPENSTREETMAP
        function inicializarMapa() {
            mapa = L.map('map', { zoomControl: false, attributionControl: false }).setView([40.4167, -3.7037], 6); 

            // Capa con trucos de almacenamiento para forzar el modo offline en el móvil
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                crossOrigin: true,
                keepBuffer: 10,       // Descarga un colchón grande de mapas alrededor de la pantalla
                updateWhenIdle: false // Descarga imágenes más rápido mientras te mueves
            }).addTo(mapa);

            const iconoMoto = L.divIcon({
                html: '<span style="font-size: 28px;">🏍️</span>',
                className: 'marcador-moto',
                iconAnchor: [14, 14]
            });
            marcadorMoto = L.marker([40.4167, -3.7037], { icon: iconoMoto }).addTo(mapa);
        }

        // 2. DESCARGA AUTOMÁTICA DE MAPAS Y CURVAS (WIFI EN CASA)
        async function descargarYProcesarZona() {
            const zona = document.getElementById('zona-input').value.trim();
            if(!zona) return alert("Escribe una zona válida");

            estadoEl.innerText = "Descargando carreteras de OSM...";
            
            // Query para traer carreteras principales de la zona
            const query = `[out:json][timeout:25];
                area["name"="${zona}"]->.searchArea;
                (way["highway"~"primary|secondary|tertiary"](area.searchArea););
                out geom;`;
            
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(!data.elements || data.elements.length === 0) {
                    estadoEl.innerText = "No se encontraron datos.";
                    return;
                }

                // Procesamos las curvas geométricamente
                analizarCurvasDelMapa(data.elements);

                // Buscamos el primer punto válido para mover el mapa de OpenStreetMap a esa provincia
                const primerPunto = data.elements.find(e => e.geometry && e.geometry.length > 0).geometry[0];
                mapa.setView([primerPunto.lat, primerPunto.lon], 15);
                marcadorMoto.setLatLng([primerPunto.lat, primerPunto.lon]);

                estadoEl.innerText = "Mapa centrado. ¡Curvas listas!";
                distanciaEl.innerText = `${curvasZonaOffline.length} Curvas`;

                // Escondemos el panel de configuración
                document.getElementById('config-casa').style.display = 'none';

                // NOTA INFORMATIVA: Avisamos al usuario para que mueva el mapa con el dedo y se guarde offline
                alert(`¡Éxito! Se han procesado ${curvasZonaOffline.length} curvas en la zona.\n\nCONSEJO: Desplázate un poco por el mapa con los dedos ahora que tienes WiFi para asegurar que las imágenes se quedan grabadas en el móvil.`);

            } catch (error) {
                estadoEl.innerText = "Error de conexión.";
                console.error(error);
            }
        }

        // 3. ALGORITMO AUTOMÁTICO DE CURVAS
        function analizarCurvasDelMapa(carreteras) {
            curvasZonaOffline = [];
            carreteras.forEach(carretera => {
                if (!carretera.geometry || carretera.geometry.length < 3) return;
                const puntos = carretera.geometry;

                for (let i = 1; i < puntos.length - 1; i++) {
                    const pA = puntos[i-1]; const pB = puntos[i]; const pC = puntos[i+1];

                    const rumbo1 = Math.atan2(pB.lat - pA.lat, pB.lon - pA.lon) * 180 / Math.PI;
                    const rumbo2 = Math.atan2(pC.lat - pB.lat, pC.lon - pB.lon) * 180 / Math.PI;
                    let anguloGiro = rumbo2 - rumbo1;
                    
                    if (anguloGiro > 180) anguloGiro -= 360;
                    if (anguloGiro < -180) anguloGiro += 360;

                    const anguloAbs = Math.abs(anguloGiro);
                    const direccion = anguloGiro >= 0 ? '➡️' : '⬅️';

                    if (anguloAbs > 38) {
                        curvasZonaOffline.push({ lat: pB.lat, lon: pB.lon, tipo: 'rojo', dir: direccion });
                    } else if (anguloAbs > 18) {
                        curvasZonaOffline.push({ lat: pB.lat, lon: pB.lon, tipo: 'naranja', dir: direccion });
                    } else if (anguloAbs > 6) {
                        curvasZonaOffline.push({ lat: pB.lat, lon: pB.lon, tipo: 'verde', dir: direccion });
                    }
                }
            });
        }

        // 4. SEGUIMIENTO GPS EN RUTA (100% OFFLINE)
        function actualizarPosicion(position) {
            const miLat = position.coords.latitude;
            const miLon = position.coords.longitude;

            // Centrar el mapa y la moto según tu posición GPS real en la carretera
            marcadorMoto.setLatLng([miLat, miLon]);
            mapa.panTo([miLat, miLon]);

            if (curvasZonaOffline.length === 0) return;

            let curvaCercana = null;
            let distanciaMinima = Infinity;

            curvasZonaOffline.forEach(curva => {
                const dist = calcularDistancia(miLat, miLon, curva.lat, curva.lon);
                if (dist < distanciaMinima) {
                    distanciaMinima = dist;
                    curvaCercana = curva;
                }
            });

            // Disparador de aviso en un radio de 200 metros
            if (curvaCercana && distanciaMinima < 200) {
                flechaEl.innerText = curvaCercana.dir;
                distanciaEl.innerText = `${Math.round(distanciaMinima)} m`;
                
                // Cambiamos el color de la capa translúcida (filtro) sin tapar las calles de abajo
                if (curvaCercana.tipo === 'rojo') {
                    filtroAlerta.style.backgroundColor = "rgba(211, 47, 47, 0.45)"; // Rojo Alerta
                    estadoEl.innerText = "Giro muy cerrado";
                } else if (curvaCercana.tipo === 'naranja') {
                    filtroAlerta.style.backgroundColor = "rgba(239, 108, 0, 0.45)"; // Naranja
                    estadoEl.innerText = "Curva pronunciada";
                } else {
                    filtroAlerta.style.backgroundColor = "rgba(46, 125, 50, 0.25)"; // Verde
                    estadoEl.innerText = "Curva suave";
                }
            } else {
                // Todo recto
                filtroAlerta.style.backgroundColor = "rgba(46, 125, 50, 0.25)"; // Verde suave
                flechaEl.innerText = '⬆️';
                distanciaEl.innerText = "Ruta limpia";
                estadoEl.innerText = "Carretera despejada";
            }
        }

        function errorGPS() { estadoEl.innerText = "Buscando satélites GPS..."; }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const phi1 = lat1 * Math.PI / 180; const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        window.onload = () => {
            inicializarMapa();
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(actualizarPosicion, errorGPS, {
                    enableHighAccuracy: true, maximumAge: 0, timeout: 5000
                });
            }
        };
    </script>
</body>
</html>
