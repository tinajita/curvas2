<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MotoNav OSM - Offline</title>
    
    <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/pmtiles@3.0.6/dist/index.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --accent-color: #39ff14; /* Verde neón estilo OsmAnd */
            --text-color: #ffffff;
            --panel-bg: rgba(25, 25, 25, 0.9);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: var(--text-color);
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 1;
        }

        /* PANTALLA DE BIENVENIDA Y DESCARGA */
        #setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .setup-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .setup-title span {
            color: var(--accent-color);
        }

        .setup-instructions {
            font-size: 1rem;
            color: #aaa;
            max-width: 400px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-download {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(57, 255, 20, 0.4);
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-download:active {
            transform: scale(0.95);
        }

        /* CUADRO DE PROGRESO */
        #download-progress-container {
            display: none;
            width: 80%;
            max-width: 350px;
            background: #222;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #333;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            transition: width 0.1s linear;
        }

        #progress-status {
            font-size: 0.9rem;
            color: #bbb;
        }

        #progress-percent {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 10px;
        }

        /* INTERFAZ DE NAVEGACIÓN EN MOTO */
        #hud-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 5;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }

        .hud-panel {
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid #333;
            pointer-events: auto;
        }

        .speed-val {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-color);
        }

        .speed-unit {
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-title">MOTONAV<span>OFFLINE</span></div>
        <p class="setup-instructions">Para poder usar el navegador en ruta sin cobertura, necesitas descargar el mapa regional de Andalucía en tu dispositivo.</p>
        
        <button id="btn-download-action" class="btn-download" onclick="descargarMapaDesdeGitHub()">Descargar Mapa de Andalucía</button>

        <div id="download-progress-container">
            <div id="progress-status">Conectando...</div>
            <div id="progress-percent">0%</div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="hud-overlay">
        <div class="hud-panel">
            <div class="speed-val" id="hud-speed">0</div>
            <div class="speed-unit">km/h</div>
        </div>
        <div class="hud-panel" style="font-weight: bold; color: #fff;">
            GPS <span id="gps-status" style="color: red;">●</span>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // =======================================================
        // CONFIGURACIÓN DE TU REPOSITORIO DE GITHUB
        // =======================================================
        // Cuando subas tu archivo 'andalucia.pmtiles' a GitHub Pages, cambia esta URL:
        const URL_MI_MAPA_GITHUB = "https://tu-usuario.github.io/tu-repositorio/andalucia.pmtiles";

        let map;
        let localPMTilesInstance;
        let mapaMetadataActiva = null;

        // Base de datos local IndexedDB para guardar el archivo gigante en el iPhone
        const DB_NAME = "MotoNavMapDB";
        const STORE_NAME = "maps";

        function abrirBD() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id" });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function guardarMapaEnBD(blobData, bounds) {
            const db = await abrirBD();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readwrite");
                const store = transaction.objectStore(STORE_NAME);
                const registro = { id: "mapa_activo", data: blobData, bounds: bounds, timestamp: Date.now() };
                const request = store.put(registro);
                request.onsuccess = () => resolve(true);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function cargarMapaDeBD() {
            const db = await abrirBD();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readonly");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get("mapa_activo");
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        // ==========================================
        // CONTROL DE INICIO AUTOMATIZADO VÍA TU IDEA
        // ==========================================
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Verificamos si el iPhone ya se descargó el archivo previamente
                const mapaGuardado = await cargarMapaDeBD();
                
                if (mapaGuardado && mapaGuardado.data) {
                    // ¡Perfecto! Ya existe offline en el almacenamiento. Arrancamos directo.
                    mapaMetadataActiva = mapaGuardado;
                    localPMTilesInstance = new pmtiles.PMTiles(new pmtiles.pmtiles.FileSource(mapaGuardado.data));
                    
                    document.getElementById('setup-screen').style.display = 'none';
                    initMapEngine();
                } else {
                    // No hay mapa guardado, mostramos el asistente con el botón
                    prepararPantallaDescargaInicial();
                }
            } catch (err) {
                prepararPantallaDescargaInicial();
            }
        });

        function prepararPantallaDescargaInicial() {
            document.getElementById('setup-screen').style.display = 'flex';
        }

        // FUNCIÓN DEL BOTÓN DE DESCARGA DIRECTA
        async function descargarMapaDesdeGitHub() {
            const btn = document.getElementById('btn-download-action');
            const progressContainer = document.getElementById('download-progress-container');
            const barFill = document.getElementById('progress-bar-fill');
            const txtStatus = document.getElementById('progress-status');
            const txtPercent = document.getElementById('progress-percent');

            btn.style.display = 'none';
            progressContainer.style.display = 'block';
            txtStatus.innerText = "Conectando con tu servidor de GitHub...";

            try {
                const response = await fetch(URL_MI_MAPA_GITHUB);
                if (!response.ok) throw new Error("No se pudo acceder al archivo en GitHub. Revisa el enlace o la configuración de CORS.");

                const contentLength = response.headers.get('content-length');
                const totalBytes = contentLength ? parseInt(contentLength, 10) : 0;
                
                const reader = response.body.getReader();
                let bytesDescargados = 0;
                let chunks = [];

                // Streaming de descarga con porcentaje en tiempo real
                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    bytesDescargados += value.length;

                    if (totalBytes > 0) {
                        const porcentaje = Math.round((bytesDescargados / totalBytes) * 100);
                        barFill.style.width = `${porcentaje}%`;
                        txtPercent.innerText = `${porcentaje}%`;
                        txtStatus.innerText = `Descargando carreteras de Andalucía...`;
                    } else {
                        txtPercent.innerText = `${(bytesDescargados / (1024*1024)).toFixed(1)} MB`;
                    }
                }

                txtStatus.innerText = "Guardando mapa en el almacenamiento del iPhone...";
                const datosBlob = new Blob(chunks);

                // Encuadre geográfico de Andalucía aproximado
                const limitesAndalucia = [-7.5, 35.9, -1.6, 38.8]; 
                await guardarMapaEnBD(datosBlob, limitesAndalucia);

                txtStatus.innerText = "¡Listo! Iniciando navegador...";
                txtPercent.innerText = "100%";
                
                setTimeout(() => {
                    location.reload(); // Recarga limpia: ahora leerá la BD local instantáneamente
                }, 1000);

            } catch (err) {
                alert("Error de descarga: " + err.message + "\n\n(Asegúrate de cambiar la URL_MI_MAPA_GITHUB con tu dirección real).");
                console.error(err);
                btn.style.display = 'inline-block';
                progressContainer.style.display = 'none';
            }
        }

        // =======================================================
        // MOTOR GRÁFICO DEL MAPA (EJECUCIÓN OFFLINE REAL)
        // =======================================================
        function initMapEngine() {
            // Añadimos el protocolo PMTiles a MapLibre
            let protocol = new pmtiles.Protocol();
            maplibre_gl.addProtocol("pmtiles", protocol.tile);
            protocol.add(localPMTilesInstance);

            // Estilo básico vectorial optimizado para rendimiento en móvil
            const estiloVectorialLineal = {
                "version": 8,
                "sources": {
                    "vector-tiles": {
                        "type": "vector",
                        "url": "pmtiles://" + localPMTilesInstance.source.getKey(),
                        "attribution": "© OpenStreetMap"
                    }
                },
                "layers": [
                    { "id": "background", "type": "background", "paint": { "background-color": "#1e1e1e" } },
                    { "id": "water", "type": "fill", "source": "vector-tiles", "source-layer": "water", "paint": { "fill-color": "#113344" } },
                    { "id": "roads", "type": "line", "source": "vector-tiles", "source-layer": "roads", "paint": { "line-color": "#444444", "line-width": 1.5 } },
                    { "id": "motorways", "type": "line", "source": "vector-tiles", "source-layer": "roads", "filter": ["==", "highway", "motorway"], "paint": { "line-color": "#ff9900", "line-width": 3 } },
                    { "id": "places", "type": "symbol", "source": "vector-tiles", "source-layer": "places", "layout": { "text-field": "{name}", "text-size": 12 }, "paint": { "text-color": "#ffffff" } }
                ]
            };

            // Centro inicial por defecto (Andalucía / Málaga)
            map = new maplibre_gl.Map({
                container: 'map',
                style: estiloVectorialLineal,
                center: [-4.42, 36.72], 
                zoom: 10,
                pitch: 45, // Inclinación perspectiva ideal para moto
                bearing: 0
            });

            // Arrancamos el posicionamiento GPS real del teléfono
            initRealtimeGPS();
        }

        // MEDICIÓN DE VELOCIDAD Y POSICIÓN EN MANILLAR
        function initRealtimeGPS() {
            if (!navigator.geolocation) return;

            navigator.geolocation.watchPosition((pos) => {
                document.getElementById('gps-status').style.color = 'var(--accent-color)';
                
                const lng = pos.coords.longitude;
                const lat = pos.coords.latitude;
                
                // Conversión de metros por segundo a km/h para el marcador
                if (pos.coords.speed !== null && pos.coords.speed > 0) {
                    const kmh = Math.round(pos.coords.speed * 3.6);
                    document.getElementById('hud-speed').innerText = kmh;
                } else {
                    document.getElementById('hud-speed').innerText = "0";
                }

                // Centrar dinámicamente el mapa en nuestra moto en ruta
                if (map) {
                    map.easeTo({
                        center: [lng, lat],
                        zoom: 15,
                        duration: 1000
                    });
                }
            }, (err) => {
                console.warn("Buscando señal GPS...", err);
                document.getElementById('gps-status').style.color = 'red';
            }, {
                enableHighAccuracy: true, // Forzar uso del chip GPS integrado en el iPhone
                maximumAge: 0,
                timeout: 5000
            });
        }
    </script>
</body>
</html>
