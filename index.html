<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCurvas Inteligente</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: Arial, sans-serif;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            height: 100vh; color: white;
            background-color: #2e7d32; /* Verde por defecto */
            transition: background-color 0.3s ease;
            padding: 20px;
        }

        /* Cuadro de preparación en casa (WiFi) */
        #config-casa {
            background: rgba(0,0,0,0.85);
            padding: 15px; border-radius: 12px;
            width: 100%; max-width: 400px; text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        input, button {
            width: 100%; padding: 10px; margin-top: 8px;
            border-radius: 6px; border: none; font-size: 16px;
        }
        button { background: #007bef; color: white; font-weight: bold; cursor: pointer; }

        /* Flecha Central */
        #flecha { font-size: 200px; font-weight: bold; line-height: 1; }

        /* Info de Navegación */
        footer {
            width: 100%; text-align: center;
            background-color: rgba(0, 0, 0, 0.6); padding: 15px;
            border-radius: 15px; backdrop-filter: blur(10px);
        }
        #distancia { font-size: 36px; font-weight: bold; }
        #estado { font-size: 14px; opacity: 0.8; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="config-casa">
        <label>🏠 Configuración en Casa (WiFi):</label>
        <input type="text" id="zona-input" value="Granada" placeholder="Ej: Granada, Asturias, Madrid...">
        <button onclick="descargarYProcesarZona()">📥 Descargar y Procesar Zona</button>
    </div>

    <main>
        <div id="flecha">⬆️</div>
    </main>

    <footer>
        <div id="distancia">App Lista</div>
        <div id="estado">Introduce una zona arriba y dale a descargar con WiFi</div>
    </footer>

    <script>
        const body = document.body;
        const flechaEl = document.getElementById('flecha');
        const distanciaEl = document.getElementById('distancia');
        const estadoEl = document.getElementById('estado');

        // Aquí se guardará el "mini-mapa" de curvas calculado automáticamente
        let curvasZonaOffline = [];

        // 1. CONEXIÓN AUTOMÁTICA A OPENSTREETMAP (EN CASA CON WIFI)
        async function descargarYProcesarZona() {
            const zona = document.getElementById('zona-input').value.trim();
            if(!zona) return alert("Escribe una zona válida");

            estadoEl.innerText = `Conectando con OpenStreetMap para descargar ${zona}...`;
            
            // Consulta Overpass: Busca las carreteras principales (primary, secondary, tertiary) en la zona indicada
            const query = `[out:json][timeout:25];
                area["name"="${zona}"]->.searchArea;
                (
                  way["highway"~"primary|secondary|tertiary"](area.searchArea);
                );
                out geom;`;
            
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(!data.elements || data.elements.length === 0) {
                    estadoEl.innerText = "No se encontraron carreteras en esa zona. Revisa el nombre.";
                    return;
                }

                estadoEl.innerText = "Procesando geometría de curvas...";
                analizarCurvasDelMapa(data.elements);

            } catch (error) {
                estadoEl.innerText = "Error al descargar datos de OpenStreetMap.";
                console.error(error);
            }
        }

        // 2. ALGORITMO: Analiza las carreteras y calcula los giros bruscos automáticamente
        function analizarCurvasDelMapa(carreteras) {
            curvasZonaOffline = [];

            carreteras.forEach(carretera => {
                if (!carretera.geometry || carretera.geometry.length < 3) return;
                
                const puntos = carretera.geometry;

                // Analizamos los puntos de la carretera de 3 en 3 para medir el ángulo de giro
                for (let i = 1; i < puntos.length - 1; i++) {
                    const pA = puntos[i-1];
                    const pB = puntos[i]; // Vértice de la curva
                    const pC = puntos[i+1];

                    // Trigonometría para saber el ángulo del giro en el mapa
                    const rumbo1 = Math.atan2(pB.lat - pA.lat, pB.lon - pA.lon) * 180 / Math.PI;
                    const rumbo2 = Math.atan2(pC.lat - pB.lat, pC.lon - pB.lon) * 180 / Math.PI;
                    
                    let anguloGiro = rumbo2 - rumbo1;
                    if (anguloGiro > 180) anguloGiro -= 360;
                    if (anguloGiro < -180) anguloGiro += 360;

                    const anguloAbs = Math.abs(anguloGiro);
                    const direccion = anguloGiro >= 0 ? '➡️' : '⬅️';

                    // Clasificación automática según la brusquedad del giro detectado en OSM
                    if (anguloAbs > 38) {
                        curvasZonaOffline.push({ lat: pB.lat, lon: pB.lon, tipo: 'rojo', dir: direccion });
                    } else if (anguloAbs > 18) {
                        curvasZonaOffline.push({ lat: pB.lat, lon: pB.lon, tipo: 'naranja', dir: direccion });
                    } else if (anguloAbs > 6) {
                        curvasZonaOffline.push({ lat: pB.lat, lon: pB.lon, tipo: 'verde', dir: direccion });
                    }
                }
            });

            distanciaEl.innerText = "¡Completado!";
            estadoEl.innerText = `Zona guardada en memoria. ${curvasZonaOffline.length} curvas procesadas automáticamente. ¡Ya puedes desconectar el WiFi!`;
            
            // Ocultamos el panel de casa porque ya estamos listos para la moto
            document.getElementById('config-casa').style.display = 'none';
        }

        // 3. DETECCIÓN EN RUTA (100% OFFLINE POR GPS)
        function actualizarPosicion(position) {
            if (curvasZonaOffline.length === 0) return;

            const miLat = position.coords.latitude;
            const miLon = position.coords.longitude;

            let curvaCercana = null;
            let distanciaMinima = Infinity;

            // Busca por cercanía pura en la base de datos que descargamos en casa
            curvasZonaOffline.forEach(curva => {
                const dist = calcularDistancia(miLat, miLon, curva.lat, curva.lon);
                if (dist < distanciaMinima) {
                    distanciaMinima = dist;
                    curvaCercana = curva;
                }
            });

            // Si hay una curva calculada a menos de 200 metros, disparamos la alerta en pantalla
            if (curvaCercana && distanciaMinima < 200) {
                flechaEl.innerText = curvaCercana.dir;
                distanciaEl.innerText = `${Math.round(distanciaMinima)} m`;
                
                if (curvaCercana.tipo === 'rojo') {
                    body.style.backgroundColor = '#d32f2f'; // Fondo Rojo
                    estadoEl.innerText = "¡ATENCIÓN! Curva muy peligrosa";
                } else if (curvaCercana.tipo === 'naranja') {
                    body.style.backgroundColor = '#ef6c00'; // Fondo Naranja
                    estadoEl.innerText = "Curva peligrosa";
                } else {
                    body.style.backgroundColor = '#2e7d32'; // Fondo Verde
                    estadoEl.innerText = "Curva suave";
                }
            } else {
                // Carretera limpia
                body.style.backgroundColor = '#2e7d32'; // Todo Verde
                flechaEl.innerText = '⬆️';
                distanciaEl.innerText = "Ruta limpia";
                estadoEl.innerText = "Carretera despejada";
            }
        }

        function errorGPS() {
            estadoEl.innerText = "Buscando satélites GPS...";
        }

        // Fórmula Haversine para medir metros bajo el agua/montaña sin internet
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const phi1 = lat1 * Math.PI / 180; const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Activar el chip GPS del teléfono en alta precisión
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(actualizarPosicion, errorGPS, {
                enableHighAccuracy: true, maximumAge: 0, timeout: 5000
            });
        }
    </script>
</body>
</html>
