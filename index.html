<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MotoNav Roadbook Pro</title>
    
    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { height: 100%; background-color: #050505; color: #fff; overflow: hidden; }
        #navigator-container { display: flex; flex-direction: column; height: 100vh; position: relative; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* INTERFAZ GENERAL CON RESPETO A ZONAS SEGURAS DE SAFARI */
        #ui-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            z-index: 10; 
            pointer-events: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 12px;
            padding-top: env(safe-area-inset-top, 12px);
            padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 28px); /* Protección extra anti-barra Safari */
        }

        /* BÚSQUEDA INICIAL */
        #search-block { background: rgba(15, 15, 15, 0.95); border: 1px solid #222; border-bottom: 3px solid #00ff66; padding: 12px; border-radius: 20px; pointer-events: auto; box-shadow: 0 6px 30px rgba(0,0,0,0.7); display: flex; gap: 10px; margin-top: 10px; }
        #destination-input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 14px 18px; font-size: 16px; border-radius: 25px; outline: none; }
        #destination-input:focus { border-color: #00ff66; }
        .btn-action { background: #00ff66; color: #000; border: none; padding: 0 25px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; }

        /* ==========================================
           ZONA SUPERIOR: HUD VISIÓN PERIFÉRICA (1/4 PANTALLA)
           ========================================== */
        #hud-top-danger-meter {
            width: 100%;
            height: 24vh;
            /* Gradiente por defecto oscuro */
            background: linear-gradient(to bottom, rgba(15,15,15,0.98) 65%, rgba(10,10,10,0.4) 85%, rgba(0,0,0,0));
            display: none; /* Se activa en ruta */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 20px;
            transition: background 0.25s ease; /* Transición suave de color para el rabillo del ojo */
            border-radius: 0 0 25px 25px;
        }

        #danger-chevrons-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 75px;
        }

        .danger-chevron {
            width: 55px;
            height: 75px;
            filter: drop-shadow(0 0 12px rgba(0,0,0,0.8));
        }

        #hud-curve-distance { 
            font-size: 58px; 
            font-weight: 900; 
            color: #ffffff; 
            letter-spacing: -2px; 
            line-height: 1;
            text-shadow: 0 4px 12px rgba(0,0,0,1); 
        }

        /* BOTÓN RECENTRAR ADJUSTADO */
        #recenter-container { position: absolute; top: 26vh; right: 15px; display: none; pointer-events: auto; }
        .btn-recenter { background: #00e5ff; color: #000; border: none; padding: 10px 18px; font-size: 12px; font-weight: bold; border-radius: 20px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* ==========================================
           INTERFAZ INFERIOR ELEVADA ANTI-SAFARI
           ========================================== */
        #hud-bottom-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            width: 100%; 
        }

        /* LADO IZQUIERDO: VELOCIDAD + METRICAS DE VIAJE */
        #panel-left-telemetry { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        
        .speed-pill { 
            display: flex; 
            align-items: baseline; 
            background: rgba(10, 10, 10, 0.94); 
            padding: 10px 24px; 
            border-radius: 22px; 
            border: 1px solid #252525; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.7); 
            width: fit-content; 
        }
        #speed-value { font-size: 46px; font-weight: 900; color: #00ff66; line-height: 1; }
        .speed-unit { font-size: 13px; color: #888; margin-left: 6px; font-weight: bold; text-transform: uppercase; }

        #trip-totals-pill { 
            display: none; 
            background: rgba(15, 15, 15, 0.94); 
            border: 1px solid #252525; 
            padding: 10px 18px; 
            border-radius: 18px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); 
            font-weight: bold; 
            font-size: 16px; 
            color: #fff; 
            gap: 12px; 
        }
        #trip-totals-pill span { color: #00ff66; font-weight: 900; }

        /* LADO DERECHO: CARRETERA ACTUAL/SIGUIENTE VIA */
        #panel-right-street { display: none; flex-direction: column; align-items: flex-end; pointer-events: auto; max-width: 48%; }
        .street-pill { background: rgba(15, 15, 15, 0.94); border: 2px solid #00e5ff; padding: 12px 18px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.7); display: flex; align-items: center; gap: 12px; }
        #next-street-name { font-size: 15px; font-weight: 800; color: #ffffff; text-transform: uppercase; text-align: right; letter-spacing: 0.4px; }
        .btn-close-route { background: #ff3d00; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }

        /* MARCADOR NAVEGACIÓN MOTO */
        .nav-arrow-marker { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.8)); }

        /* ==========================================
           OPTIMIZACIONES PARA MODO HORIZONTAL (LANDSCAPE)
           ========================================== */
        @media (orientation: landscape) {
            #ui-overlay {
                padding-top: env(safe-area-inset-top, 5px);
                padding-bottom: calc(env(safe-area-inset-bottom, 5px) + 12px); /* Menos agresivo en plano largo */
            }

            /* Reducimos HUD superior para maximizar mapa visible en horizontal */
            #hud-top-danger-meter {
                height: 28vh; 
                flex-direction: row; /* Elementos de lado para ahorrar espacio vertical */
                justify-content: center;
                gap: 40px;
                padding: 4px 20px;
            }

            #danger-chevrons-container { height: 50px; }
            .danger-chevron { width: 38px; height: 50px; }
            #hud-curve-distance { font-size: 46px; }

            #recenter-container { top: 32vh; }

            /* Ajustes abajo para que no se pisen */
            #hud-bottom-row { align-items: center; }
            #panel-left-telemetry { flex-direction: row; align-items: center; gap: 15px; }
            .speed-pill { padding: 6px 18px; }
            #speed-value { font-size: 36px; }
            #trip-totals-pill { padding: 8px 14px; font-size: 14px; }
            
            .street-pill { padding: 8px 14px; }
            #next-street-name { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="navigator-container">
        <div id="map"></div>

        <div id="ui-overlay">
            
            <div id="search-block">
                <input type="text" id="destination-input" placeholder="¿A dónde vamos con la moto?...">
                <button class="btn-action" onclick="fijarRutaDestino()">Ir</button>
            </div>

            <div id="hud-top-danger-meter">
                <div id="danger-chevrons-container">
                    </div>
                <div id="hud-curve-distance">-- m</div>
            </div>

            <div id="recenter-container">
                <button class="btn-recenter" onclick="recenterManual()">✕ Recentrar</button>
            </div>

            <div id="hud-bottom-row">
                <div id="panel-left-telemetry">
                    <div class="speed-pill">
                        <span id="speed-value">0</span>
                        <span class="speed-unit">km/h</span>
                    </div>
                    <div id="trip-totals-pill">
                        <div id="total-distance-display">-- KM</div>
                        <div style="color: #444;">|</div>
                        <div id="total-time-display">-- MIN</div>
                    </div>
                </div>
                
                <div id="panel-right-street">
                    <div class="street-pill">
                        <span id="next-street-name">Ruta</span>
                        <button class="btn-close-route" onclick="cancelarRuta()">✕</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>

    <script>
        let map;
        let arrowMarker;
        let miPosicion = [-4.4214, 36.7213]; // Málaga base
        let destinoCoors = null;
        let lastValidBearing = 0;
        let mapaDesplazadoPorUsuario = false;
        let autoRecenterTimer = null;
        let rutaActiva = false;

        const MAP_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
        
        // Ajuste elástico del motor de cámara para dejar espacio libre a las interfaces elevadas
        const getCenterOffset = () => [0, window.innerHeight * (window.innerHeight > window.innerWidth ? 0.18 : 0.10)];

        // CONFIGURACIÓN CROMÁTICA PARA EL RABILLO DEL OJO
        const CONFIG_PELIGRO = {
            low: {
                color: '#00ff66',
                paneles: 1,
                fondo: 'linear-gradient(to bottom, rgba(0, 45, 15, 0.98) 65%, rgba(5, 20, 5, 0.4) 85%, rgba(0,0,0,0))'
            },
            medium: {
                color: '#ffb300',
                paneles: 2,
                fondo: 'linear-gradient(to bottom, rgba(75, 45, 0, 0.98) 65%, rgba(20, 12, 0, 0.4) 85%, rgba(0,0,0,0))'
            },
            high: {
                color: '#ff3d00',
                paneles: 3,
                fondo: 'linear-gradient(to bottom, rgba(110, 8, 8, 0.98) 65%, rgba(30, 2, 2, 0.4) 85%, rgba(0,0,0,0))'
            }
        };

        function cuantificarMetrosCurva(metros) {
            if (metros <= 25) return "25 m";
            if (metros <= 50) return "50 m";
            if (metros <= 100) return "100 m";
            if (metros <= 150) return "150 m";
            return (Math.round(metros / 50) * 50) + " m";
        }

        // --- MANIPULADOR DE INTERFAZ PERIFÉRICA DINÁMICA ---
        function renderizarHUDPeligro(direccion, peligrosidad) {
            const hudTop = document.getElementById('hud-top-danger-meter');
            const container = document.getElementById('danger-chevrons-container');
            container.innerHTML = ''; 

            const config = CONFIG_PELIGRO[peligrosidad] || CONFIG_PELIGRO.low;

            // 1. Inyectar el gradiente cromático de fondo al cuarto superior
            hudTop.style.background = config.fondo;

            // 2. Montar los paneles direccionales angulados
            const scaleX = (direccion === 'izq') ? -1 : 1;
            const svgChevron = `<svg class="danger-chevron" style="transform: scaleX(${scaleX});" viewBox="0 0 24 24" fill="none"><path d="M10 5L17 12L10 19" stroke="${config.color}" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

            for (let i = 0; i < config.paneles; i++) {
                container.innerHTML += svgChevron;
            }
        }

        function initNavigator() {
            map = new maplibregl.Map({ container: 'map', style: MAP_STYLE, center: miPosicion, zoom: 16.8, pitch: 62, bearing: 0, attributionControl: false });
            map.on('load', () => { configurarCapasRuta(); crearIconoNavegacion(); arrancarSeguimientoGPS(); configurarEventosGestos(); setTimeout(recenterManual, 300); });
            
            // Forzar recolocación de cámara si se gira el dispositivo sobre la marcha
            window.addEventListener('resize', () => { if (map) map.setOffset(getCenterOffset()); });
        }

        function configurarEventosGestos() {
            map.on('dragstart', () => { mapaDesplazadoPorUsuario = true; document.getElementById('recenter-container').style.display = 'block'; clearTimeout(autoRecenterTimer); });
            map.on('dragend', () => { clearTimeout(autoRecenterTimer); autoRecenterTimer = setTimeout(recenterManual, 6000); });
        }

        function recenterManual() {
            mapaDesplazadoPorUsuario = false;
            document.getElementById('recenter-container').style.display = 'none';
            clearTimeout(autoRecenterTimer);
            map.easeTo({ center: miPosicion, zoom: 16.8, bearing: lastValidBearing, pitch: 62, offset: getCenterOffset(), duration: 600 });
        }

        function configurarCapasRuta() {
            map.addSource('route-source', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addLayer({ id: 'route-casing', type: 'line', source: 'route-source', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#000000', 'line-width': 16, 'line-opacity': 0.85 } });
            map.addLayer({ id: 'route-core', type: 'line', source: 'route-source', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#00ff66', 'line-width': 8, 'line-opacity': 0.95 } });
        }

        function crearIconoNavegacion() {
            const container = document.createElement('div');
            container.className = 'nav-arrow-marker';
            container.innerHTML = `<svg width="45" height="45" viewBox="0 0 100 100" fill="none"><path d="M50 5L90 90L50 70L10 90L50 5Z" fill="#ffffff" stroke="#00e5ff" stroke-width="6" stroke-linejoin="round"/></svg>`;
            arrowMarker = new maplibregl.Marker({ element: container }).setLngLat(miPosicion).addTo(map);
        }

        async function fijarRutaDestino() {
            const query = document.getElementById('destination-input').value;
            if (!query) return;
            try {
                const searchResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const searchData = await searchResponse.json();
                if (searchData.length === 0) return;
                destinoCoors = [parseFloat(searchData[0].lon), parseFloat(searchData[0].lat)];
                rutaActiva = true;
                
                document.getElementById('search-block').style.display = 'none';
                document.getElementById('hud-top-danger-meter').style.display = 'flex';
                document.getElementById('trip-totals-pill').style.display = 'flex';
                document.getElementById('panel-right-street').style.display = 'flex';
                
                actualizarRutaEnMarcha();
                recenterManual();
            } catch (error) { console.error(error); }
        }

        async function actualizarRutaEnMarcha() {
            if (!rutaActiva || !destinoCoors) return;
            try {
                const routeResponse = await fetch(`https://router.project-osrm.org/route/v1/driving/${miPosicion[0]},${miPosicion[1]};${destinoCoors[0]},${destinoCoors[1]}?overview=full&geometries=geojson&steps=true`);
                const routeData = await routeResponse.json();
                if (!routeData.routes || routeData.routes.length === 0) return;
                const dataRuta = routeData.routes[0];
                map.getSource('route-source').setData({ type: 'FeatureCollection', features: [{ type: 'Feature', geometry: dataRuta.geometry, properties: {} }] });
                
                const kms = (dataRuta.distance / 1000).toFixed(1);
                document.getElementById('total-distance-display').innerHTML = `<span>${kms}</span> KM`;
                const totalMinutos = Math.round(dataRuta.duration / 60);
                if (totalMinutos >= 60) { document.getElementById('total-time-display').innerHTML = `<span>${Math.floor(totalMinutos / 60)}h ${totalMinutos % 60}m</span>`; } else { document.getElementById('total-time-display').innerHTML = `<span>${totalMinutos}</span> MIN`; }

                const steps = dataRuta.legs[0].steps;
                if (steps && steps.length > 1) {
                    const metrosRealesGiro = Math.round(steps[0].distance); 
                    const proximoGiro = steps[1];
                    const nombreSiguienteVia = proximoGiro.name || proximoGiro.ref || "Tramo Continuo";
                    document.getElementById('next-street-name').innerText = nombreSiguienteVia;
                    
                    document.getElementById('hud-curve-distance').innerText = cuantificarMetrosCurva(metrosRealesGiro);

                    const modifier = proximoGiro.maneuver.modifier || '';
                    let direccion = 'recto';
                    if (modifier.includes('left')) direccion = 'izq';
                    if (modifier.includes('right')) direccion = 'der';

                    let peligrosidad = 'low'; 
                    const maneuverType = proximoGiro.maneuver.type;

                    if (motos_danger_types_medium.includes(maneuverType) || motos_danger_modifiers_medium.includes(modifier)) {
                        peligrosidad = 'medium'; 
                    }
                    if (motos_danger_modifiers_high.includes(modifier)) {
                        peligrosidad = 'high'; 
                    }

                    renderizarHUDPeligro(direccion, peligrosidad);
                }
            } catch (e) { console.error(e); }
        }

        const motos_danger_types_medium = ['turn', 'on ramp'];
        const motos_danger_modifiers_medium = ['slight left', 'slight right', 'left', 'right'];
        const motos_danger_modifiers_high = ['sharp left', 'sharp right', 'uturn'];

        function cancelarRuta() { rutaActiva = false; destinoCoors = null; map.getSource('route-source').setData({ type: 'FeatureCollection', features: [] }); document.getElementById('hud-top-danger-meter').style.display = 'none'; document.getElementById('trip-totals-pill').style.display = 'none'; document.getElementById('panel-right-street').style.display = 'none'; document.getElementById('search-block').style.display = 'flex'; document.getElementById('destination-input').value = ''; recenterManual(); }

        function arrancarSeguimientoGPS() {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition((position) => {
                const lon = position.coords.longitude;
                const lat = position.coords.latitude;
                const velocidad = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;
                miPosicion = [lon, lat];
                if (position.coords.heading !== null && position.coords.heading !== undefined) { lastValidBearing = position.coords.heading; }
                document.getElementById('speed-value').innerText = velocidad;
                arrowMarker.setLngLat(miPosicion);
                const arrowElement = document.querySelector('.nav-arrow-marker');
                if (arrowElement) { arrowElement.style.transform = `rotate(${lastValidBearing}deg)`; }
                if (rutaActiva) { actualizarRutaEnMarcha(); }
                if (!mapaDesplazadoPorUsuario) { map.easeTo({ center: miPosicion, bearing: lastValidBearing, offset: getCenterOffset(), duration: 250, easing: (t) => t }); }
            }, (err) => console.error(err), { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        window.onload = initNavigator;
    </script>
</body>
</html>
