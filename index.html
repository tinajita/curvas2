<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCurvas - Regiones</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: Arial, sans-serif;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            height: 100vh; color: white;
            background-color: #1a1a1a;
            transition: background-color 0.4s ease;
            padding: 20px;
        }
        header { width: 100%; text-align: center; }
        
        /* Selector de Regiones */
        #selector-zona {
            background: rgba(255,255,255,0.1);
            padding: 15px; border-radius: 10px;
            text-align: center; width: 100%; max-width: 400px;
        }
        select {
            width: 100%; padding: 10px; font-size: 16px;
            border-radius: 5px; margin-top: 10px;
        }

        /* Pantalla Principal */
        main { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
        #flecha { font-size: 180px; font-weight: bold; text-shadow: 0px 5px 10px rgba(0,0,0,0.3); }

        footer {
            width: 100%; text-align: center;
            background-color: rgba(0, 0, 0, 0.5); padding: 15px;
            border-radius: 15px; backdrop-filter: blur(5px);
        }
        #distancia { font-size: 32px; font-weight: bold; }
        #estado { font-size: 16px; opacity: 0.8; margin-top: 5px; }
    </style>
</head>
<body>

    <header>
        <div id="selector-zona">
            <label for="provincias">📍 Selecciona tu zona de ruta:</label>
            <select id="provincias" onchange="cambiarZona()">
                <option value="ninguna">--- Elige Provincia ---</option>
                <option value="madrid">Madrid (Cruz Verde / Atazar)</option>
                <option value="asturias">Asturias (Puertos de Montaña)</option>
            </select>
        </div>
    </header>

    <main>
        <div id="flecha">--</div>
    </main>

    <footer>
        <div id="distancia">Selecciona Zona</div>
        <div id="estado">Esperando que elijas provincia...</div>
    </footer>

    <script>
        const body = document.body;
        const flechaEl = document.getElementById('flecha');
        const distanciaEl = document.getElementById('distancia');
        const estadoEl = document.getElementById('estado');
        
        // BASE DE DATOS DIVIDIDA POR PROVINCIAS
        const MAPAS_PROVINCIALES = {
            madrid: [
                { lat: 40.59251, lon: -4.19734, tipo: 'rojo', direccion: '⬅️' },
                { lat: 40.59120, lon: -4.19510, tipo: 'naranja', direccion: '➡️' }
            ],
            asturias: [
                { lat: 43.31210, lon: -5.10120, tipo: 'rojo', direccion: '➡️' }, // Ejemplo Fito / Lagos
                { lat: 43.31500, lon: -5.10450, tipo: 'verde', direccion: '⬅️' }
            ]
        };

        let curvasActivas = [];

        // Cambia la base de datos activa según lo que elija el motero
        function cambiarZona() {
            const zonaSeleccionada = document.getElementById('provincias').value;
            
            if (MAPAS_PROVINCIALES[zonaSeleccionada]) {
                curvasActivas = MAPAS_PROVINCIALES[zonaSeleccionada];
                distanciaEl.innerText = "Zona Cargada";
                estadoEl.innerText = `Listo para rodar offline con ${curvasActivas.length} curvas.`;
            } else {
                curvasActivas = [];
                distanciaEl.innerText = "Sin Datos";
                estadoEl.innerText = "Selecciona una provincia válida.";
            }
        }

        // BUCLE DE SEGUIMIENTO GPS
        function actualizarPosicion(position) {
            if (curvasActivas.length === 0) return;

            const miLat = position.coords.latitude;
            const miLon = position.coords.longitude;

            let curvaCercana = null;
            let distanciaMinima = Infinity;

            // Busca solo en las curvas de la provincia seleccionada
            curvasActivas.forEach(curva => {
                const dist = calcularDistancia(miLat, miLon, curva.lat, curva.lon);
                if (dist < distanciaMinima) {
                    distanciaMinima = dist;
                    curvaCercana = curva;
                }
            });

            // Alerta si estamos a menos de 200 metros
            if (curvaCercana && distanciaMinima < 200) {
                flechaEl.innerText = curvaCercana.direccion;
                distanciaEl.innerText = `${Math.round(distanciaMinima)} m`;
                
                if (curvaCercana.tipo === 'rojo') body.style.backgroundColor = '#d32f2f';
                else if (curvaCercana.tipo === 'naranja') body.style.backgroundColor = '#ef6c00';
                else body.style.backgroundColor = '#2e7d32';
                
                estadoEl.innerText = "Aproximación a curva";
            } else {
                body.style.backgroundColor = '#2e7d32';
                flechaEl.innerText = '⬆️';
                distanciaEl.innerText = "Ruta limpia";
                estadoEl.innerText = "Carretera despejada";
            }
        }

        function errorGPS(err) {
            estadoEl.innerText = "Error de señal GPS.";
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(actualizarPosicion, errorGPS, {
                enableHighAccuracy: true, maximumAge: 0, timeout: 5000
            });
        }

        // Fórmula Haversine para medir metros entre coordenadas
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const phi1 = lat1 * Math.PI / 180; const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
