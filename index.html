<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MotoNav Roadbook Pro</title>
    
    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body, html { height: 100dvh; background-color: #050505; color: #fff; overflow: hidden; }
        #navigator-container { display: flex; flex-direction: column; height: 100dvh; position: relative; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* INDICADOR DE DESCARGA OFFLINE */
        #download-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.92); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 15px; padding: 20px; text-align: center;
        }
        .progress-bar-container { width: 80%; max-width: 300px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #00ff66; transition: width 0.1s ease; }
        #download-status { font-size: 14px; color: #888; font-weight: bold; text-transform: uppercase; }

        #ui-overlay { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; 
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; 
            padding: 14px;
            padding-top: calc(env(safe-area-inset-top, 12px) + 4px);
            padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 38px);
        }

        #search-block { background: rgba(15, 15, 15, 0.96); border: 1px solid #222; border-bottom: 3px solid #00ff66; padding: 12px; border-radius: 20px; pointer-events: auto; box-shadow: 0 6px 30px rgba(0,0,0,0.8); display: flex; gap: 10px; margin-top: 10px; }
        #destination-input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 14px 18px; font-size: 16px; border-radius: 25px; outline: none; }
        #destination-input:focus { border-color: #00ff66; }
        .btn-action { background: #00ff66; color: #000; border: none; padding: 0 25px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; }

        #hud-top-danger-meter {
            width: 100%; height: 22vh;
            background: linear-gradient(to bottom, rgba(15,15,15,0.98) 65%, rgba(10,10,10,0.4) 85%, rgba(0,0,0,0));
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 20px; transition: background 0.2s ease; border-radius: 0 0 22px 22px;
        }
        #danger-chevrons-container { display: flex; align-items: center; justify-content: center; gap: 8px; height: 70px; }
        .danger-chevron { width: 52px; height: 70px; filter: drop-shadow(0 0 12px rgba(0,0,0,0.9)); }
        #hud-curve-distance { font-size: 56px; font-weight: 900; color: #ffffff; letter-spacing: -2px; line-height: 1; text-shadow: 0 4px 12px rgba(0,0,0,1); }

        #recenter-container { position: absolute; top: 25vh; right: 15px; display: none; pointer-events: auto; }
        .btn-recenter { background: #00e5ff; color: #000; border: none; padding: 10px 18px; font-size: 12px; font-weight: bold; border-radius: 20px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        #hud-bottom-row { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
        #panel-left-telemetry { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .speed-pill { display: flex; align-items: baseline; background: rgba(10, 10, 10, 0.95); padding: 10px 24px; border-radius: 22px; border: 1px solid #252525; box-shadow: 0 6px 20px rgba(0,0,0,0.8); width: fit-content; }
        #speed-value { font-size: 46px; font-weight: 900; color: #00ff66; line-height: 1; }
        .speed-unit { font-size: 13px; color: #888; margin-left: 6px; font-weight: bold; text-transform: uppercase; }

        #trip-totals-pill { display: none; background: rgba(15, 15, 15, 0.95); border: 1px solid #252525; padding: 10px 18px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.7); font-weight: bold; font-size: 16px; color: #fff; gap: 12px; }
        #trip-totals-pill span { color: #00ff66; font-weight: 900; }

        #panel-right-street { display: none; flex-direction: column; align-items: flex-end; pointer-events: auto; max-width: 48%; }
        .street-pill { background: rgba(15, 15, 15, 0.95); border: 2px solid #00e5ff; padding: 12px 18px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 12px; }
        #next-street-name { font-size: 15px; font-weight: 800; color: #ffffff; text-transform: uppercase; text-align: right; letter-spacing: 0.4px; }
        .btn-close-route { background: #ff3d00; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .nav-arrow-marker { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.9)); }
        #gps-alert-banner { position: absolute; top: 20px; left: 20px; right: 20px; background: #ff3d00; color: white; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; z-index: 999; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: auto; }

        @media (orientation: landscape) {
            #ui-overlay { padding-top: env(safe-area-inset-top, 4px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); }
            #hud-top-danger-meter { height: 52px; flex-direction: row; justify-content: space-between; padding: 0 40px; border-radius: 0 0 14px 14px; }
            #danger-chevrons-container { height: 38px; gap: 12px; }
            .danger-chevron { width: 26px; height: 38px; }
            #hud-curve-distance { font-size: 34px; }
            #recenter-container { top: 65px; }
            #hud-bottom-row { align-items: center; }
            #panel-left-telemetry { flex-direction: row; align-items: center; gap: 12px; }
            .speed-pill { padding: 6px 16px; }
            #speed-value { font-size: 32px; }
            #trip-totals-pill { padding: 8px 14px; font-size: 14px; }
            .street-pill { padding: 8px 14px; }
            #next-street-name { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="download-overlay">
        <h2 style="color: #00ff66; font-weight: 900;">MOTO-NAV OFFLINE</h2>
        <p id="download-msg" style="max-width: 280px; font-size: 14px;">Comprobando cartografía local...</p>
        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <div id="download-status">0%</div>
    </div>

    <div id="gps-alert-banner" onclick="this.style.display='none'">
        ⚠️ GPS sin precisión. Si usas Chrome en iOS, ve a Ajustes del iPhone -> Chrome -> Localización -> Activa "Ubicación exacta".
    </div>

    <div id="navigator-container">
        <div id="map"></div>

        <div id="ui-overlay">
            <div id="search-block">
                <input type="text" id="destination-input" placeholder="¿A dónde vamos con la moto?...">
                <button class="btn-action" onclick="fijarRutaDestino()">Ir</button>
            </div>

            <div id="hud-top-danger-meter">
                <div id="danger-chevrons-container"></div>
                <div id="hud-curve-distance">-- m</div>
            </div>

            <div id="recenter-container">
                <button class="btn-recenter" onclick="recenterManual()">✕ Recentrar</button>
            </div>

            <div id="hud-bottom-row">
                <div id="panel-left-telemetry">
                    <div class="speed-pill">
                        <span id="speed-value">0</span>
                        <span class="speed-unit">km/h</span>
                    </div>
                    <div id="trip-totals-pill">
                        <div id="total-distance-display">-- KM</div>
                        <div style="color: #444;">|</div>
                        <div id="total-time-display">-- MIN</div>
                    </div>
                </div>
                
                <div id="panel-right-street">
                    <div class="street-pill">
                        <span id="next-street-name">Ruta</span>
                        <button class="btn-close-route" onclick="cancelarRuta()">✕</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>

    <script>
        let map;
        let arrowMarker;
        let miPosicion = [-4.4214, 36.7213]; // Málaga base
        let destinoCoors = null;
        let lastValidBearing = 0;
        let mapaDesplazadoPorUsuario = false;
        let autoRecenterTimer = null;
        let rutaActiva = false;

        const PMTILES_URL = 'https://github.com/tinajita/curvas2/releases/download/V.1.0.0/planet_-6.32.36.33_-3.15.38.01.pmtiles';
        
        // BASE DE DATOS LOCAL INDEXEDDB
        const DB_NAME = 'MotoNavOfflineDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'maps';
        const MAP_KEY = 'andalucia_map';

        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    e.target.result.createObjectStore(STORE_NAME);
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveMapToDB(blob) {
            const db = await initIndexedDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(blob, MAP_KEY);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getMapFromDB() {
            const db = await initIndexedDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const request = tx.objectStore(STORE_NAME).get(MAP_KEY);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        const getCenterOffset = () => [0, window.innerHeight * (window.innerHeight > window.innerWidth ? 0.16 : 0.04)];

        const CONFIG_PELIGRO = {
            low: { color: '#00ff66', paneles: 1, fondo: 'linear-gradient(to bottom, rgba(0, 50, 15, 0.98) 65%, rgba(5, 20, 5, 0.3) 85%, rgba(0,0,0,0))' },
            medium: { color: '#ffb300', paneles: 2, fondo: 'linear-gradient(to bottom, rgba(80, 48, 0, 0.98) 65%, rgba(20, 12, 0, 0.3) 85%, rgba(0,0,0,0))' },
            high: { color: '#ff3d00', paneles: 3, fondo: 'linear-gradient(to bottom, rgba(120, 6, 6, 0.98) 65%, rgba(35, 2, 2, 0.3) 85%, rgba(0,0,0,0))' }
        };

        function cuantificarMetrosCurva(metros) {
            if (metros <= 25) return "25 m";
            if (metros <= 50) return "50 m";
            if (metros <= 100) return "100 m";
            if (metros <= 150) return "150 m";
            return (Math.round(metros / 50) * 50) + " m";
        }

        function renderizarHUDPeligro(direccion, peligrosidad) {
            const hudTop = document.getElementById('hud-top-danger-meter');
            const container = document.getElementById('danger-chevrons-container');
            container.innerHTML = ''; 

            const config = CONFIG_PELIGRO[peligrosidad] || CONFIG_PELIGRO.low;
            hudTop.style.background = config.fondo;

            const scaleX = (direccion === 'izq') ? -1 : 1;
            const svgChevron = `<svg class="danger-chevron" style="transform: scaleX(${scaleX});" viewBox="0 0 24 24" fill="none"><path d="M10 5L17 12L10 19" stroke="${config.color}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

            for (let i = 0; i < config.paneles; i++) { container.innerHTML += svgChevron; }
        }

        // DESCARGA CON BARRA DE PROGRESO REAL
        function descargarMapaConProgreso() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', PMTILES_URL, true);
                xhr.responseType = 'blob';

                xhr.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const porcentaje = Math.round((e.loaded / e.total) * 100);
                        document.getElementById('progress-bar').style.width = porcentaje + '%';
                        document.getElementById('download-status').innerText = porcentaje + '%';
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) { resolve(xhr.response); } 
                    else { reject(new Error('Fallo al descargar cartografía')); }
                };
                
                xhr.onerror = () => reject(new Error('Error de red. Verifica tu conexión.'));
                xhr.send();
            });
        }

        // CONTROLADOR PRINCIPAL DE INICIALIZACIÓN OFFLINE
        async function gestionarCartografiaYArrancar() {
            try {
                let mapaBlob = await getMapFromDB();
                
                if (!mapaBlob) {
                    document.getElementById('download-msg').innerText = "Descargando mapa base para rutas (Málaga/Guadalteba). Solo una vez...";
                    mapaBlob = await descargarMapaConProgreso();
                    document.getElementById('download-msg').innerText = "Guardando en almacenamiento local seguro...";
                    await saveMapToDB(mapaBlob);
                }

                // Configurar PMTiles usando el Blob local
                const protocol = new maplibregl.Protocol();
                maplibregl.addProtocol("pmtiles", protocol.callback);
                
                const sourcePMTiles = new pmtiles.PMTiles(new pmtiles.BlobSource(mapaBlob));
                protocol.add(sourcePMTiles);

                // Ocultar pantalla de carga e iniciar visor
                document.getElementById('download-overlay').style.display = 'none';
                initNavigator();

            } catch (error) {
                console.error(error);
                document.getElementById('download-msg').innerText = "Error: Se requiere conexión a Internet la primera vez para bajar el mapa local.";
                document.getElementById('download-msg').style.color = "#ff3d00";
            }
        }

        function initNavigator() {
            // DISEÑO DE ESTILO 100% OFFLINE BASADO EN TU ARCHIVO PMTILES
            const OFFLINE_STYLE = {
                version: 8,
                sources: {
                    "moto-offline-source": {
                        type: "vector",
                        url: "pmtiles://andalucia_map",
                        attribution: "© OpenStreetMap"
                    }
                },
                layers: [
                    { id: "background", type: "background", paint: { "background-color": "#0d0d0e" } },
                    { id: "water", type: "fill", source: "moto-offline-source", "source-layer": "water", paint: { "fill-color": "#121e2a" } },
                    { id: "landuse", type: "fill", source: "moto-offline-source", "source-layer": "landuse", paint: { "fill-color": "#111411" } },
                    // Red de carreteras secundarias/pistas
                    { 
                        id: "roads-low", type: "line", source: "moto-offline-source", "source-layer": "roads", 
                        paint: { "line-color": "#262629", "line-width": ["interpolate", ["linear"], ["zoom"], 12, 1, 16, 3] } 
                    },
                    // Carreteras principales y nacionales de alto contraste para visibilidad en moto
                    { 
                        id: "roads-high", type: "line", source: "moto-offline-source", "source-layer": "roads",
                        filter: ["in", "kind", "highway_motorway", "highway_trunk", "highway_primary", "highway_secondary", "motorway", "trunk", "primary", "secondary"],
                        paint: { "line-color": "#4a4d54", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 2, 15, 6] } 
                    }
                ]
            };

            map = new maplibregl.Map({ 
                container: 'map', 
                style: OFFLINE_STYLE, 
                center: miPosicion, 
                zoom: 14.5, 
                pitch: 62, 
                bearing: 0, 
                attributionControl: false 
            });

            map.on('load', () => { 
                configurarCapasRuta(); 
                crearIconoNavegacion(); 
                arrancarSeguimientoGPS(); 
                configurarEventosGestos(); 
                setTimeout(recenterManual, 300); 
            });
            
            window.addEventListener('resize', () => { if (map) map.setOffset(getCenterOffset()); });
        }

        function configurarEventosGestos() {
            map.on('dragstart', () => { mapaDesplazadoPorUsuario = true; document.getElementById('recenter-container').style.display = 'block'; clearTimeout(autoRecenterTimer); });
            map.on('dragend', () => { clearTimeout(autoRecenterTimer); autoRecenterTimer = setTimeout(recenterManual, 6000); });
        }

        function recenterManual() {
            mapaDesplazadoPorUsuario = false;
            document.getElementById('recenter-container').style.display = 'none';
            clearTimeout(autoRecenterTimer);
            map.easeTo({ center: miPosicion, zoom: 14.5, bearing: lastValidBearing, pitch: 62, offset: getCenterOffset(), duration: 600 });
        }

        function configurarCapasRuta() {
            map.addSource('route-source', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addLayer({ id: 'route-casing', type: 'line', source: 'route-source', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#000000', 'line-width': 16, 'line-opacity': 0.85 } });
            map.addLayer({ id: 'route-core', type: 'line', source: 'route-source', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#00ff66', 'line-width': 8, 'line-opacity': 0.95 } });
        }

        function crearIconoNavegacion() {
            const container = document.createElement('div');
            container.className = 'nav-arrow-marker';
            container.innerHTML = `<svg width="45" height="45" viewBox="0 0 100 100" fill="none"><path d="M50 5L90 90L50 70L10 90L50 5Z" fill="#ffffff" stroke="#00e5ff" stroke-width="6" stroke-linejoin="round"/></svg>`;
            arrowMarker = new maplibregl.Marker({ element: container }).setLngLat(miPosicion).addTo(map);
        }

        async function fijarRutaDestino() {
            const query = document.getElementById('destination-input').value;
            if (!query) return;
            try {
                const searchResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const searchData = await searchResponse.json();
                if (searchData.length === 0) return;
                destinoCoors = [parseFloat(searchData[0].lon), parseFloat(searchData[0].lat)];
                rutaActiva = true;
                
                document.getElementById('search-block').style.display = 'none';
                document.getElementById('hud-top-danger-meter').style.display = 'flex';
                document.getElementById('trip-totals-pill').style.display = 'flex';
                document.getElementById('panel-right-street').style.display = 'flex';
                
                actualizarRutaEnMarcha();
                recenterManual();
            } catch (error) { alert("La búsqueda requiere cobertura de datos móviles."); console.error(error); }
        }

        async function actualizarRutaEnMarcha() {
            if (!rutaActiva || !destinoCoors) return;
            try {
                const routeResponse = await fetch(`https://router.project-osrm.org/route/v1/driving/${miPosicion[0]},${miPosicion[1]};${destinoCoors[0]},${destinoCoors[1]}?overview=full&geometries=geojson&steps=true`);
                const routeData = await routeResponse.json();
                if (!routeData.routes || routeData.routes.length === 0) return;
                const dataRuta = routeData.routes[0];
                map.getSource('route-source').setData({ type: 'FeatureCollection', features: [{ type: 'Feature', geometry: dataRuta.geometry, properties: {} }] });
                
                const kms = (dataRuta.distance / 1000).toFixed(1);
                document.getElementById('total-distance-display').innerHTML = `<span>${kms}</span> KM`;
                const totalMinutos = Math.round(dataRuta.duration / 60);
                if (totalMinutos >= 60) { document.getElementById('total-time-display').innerHTML = `<span>${Math.floor(totalMinutos / 60)}h ${totalMinutos % 60}m</span>`; } else { document.getElementById('total-time-display').innerHTML = `<span>${totalMinutos}</span> MIN`; }

                const steps = dataRuta.legs[0].steps;
                if (steps && steps.length > 1) {
                    const metrosRealesGiro = Math.round(steps[0].distance); 
                    const proximoGiro = steps[1];
                    document.getElementById('next-street-name').innerText = proximoGiro.name || proximoGiro.ref || "Tramo Continuo";
                    document.getElementById('hud-curve-distance').innerText = cuantificarMetrosCurva(metrosRealesGiro);

                    const modifier = proximoGiro.maneuver.modifier || '';
                    let direccion = 'recto';
                    if (modifier.includes('left')) direccion = 'izq';
                    if (modifier.includes('right')) direccion = 'der';

                    let peligrosidad = 'low'; 
                    const maneuverType = proximoGiro.maneuver.type;

                    if (motos_danger_types_medium.includes(maneuverType) || motos_danger_modifiers_medium.includes(modifier)) { peligrosidad = 'medium'; }
                    if (motos_danger_modifiers_high.includes(modifier)) { peligrosidad = 'high'; }

                    renderizarHUDPeligro(direccion, peligrosidad);
                }
            } catch (e) { console.log("Calculando ruta/GPS en zona sin cobertura."); }
        }

        const motos_danger_types_medium = ['turn', 'on ramp'];
        const motos_danger_modifiers_medium = ['slight left', 'slight right', 'left', 'right'];
        const motos_danger_modifiers_high = ['sharp left', 'sharp right', 'uturn'];

        function cancelarRuta() { rutaActiva = false; destinoCoors = null; map.getSource('route-source').setData({ type: 'FeatureCollection', features: [] }); document.getElementById('hud-top-danger-meter').style.display = 'none'; document.getElementById('trip-totals-pill').style.display = 'none'; document.getElementById('panel-right-street').style.display = 'none'; document.getElementById('search-block').style.display = 'flex'; document.getElementById('destination-input').value = ''; recenterManual(); }

        function arrancarSeguimientoGPS() {
            if (!navigator.geolocation) return;
            
            navigator.geolocation.watchPosition((position) => {
                document.getElementById('gps-alert-banner').style.display = 'none';

                const lon = position.coords.longitude;
                const lat = position.coords.latitude;
                const velocidad = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;
                
                miPosicion = [lon, lat];
                if (position.coords.heading !== null && position.coords.heading !== undefined) { lastValidBearing = position.coords.heading; }
                
                document.getElementById('speed-value').innerText = velocidad;
                arrowMarker.setLngLat(miPosicion);
                
                const arrowElement = document.querySelector('.nav-arrow-marker');
                if (arrowElement) { arrowElement.style.transform = `rotate(${lastValidBearing}deg)`; }
                if (rutaActiva) { actualizarRutaEnMarcha(); }
                
                if (!mapaDesplazadoPorUsuario) { 
                    map.easeTo({ center: miPosicion, bearing: lastValidBearing, offset: getCenterOffset(), duration: 280, easing: (t) => t }); 
                }
            }, (err) => {
                console.error("Error GPS:", err);
                document.getElementById('gps-alert-banner').style.display = 'block';
            }, { 
                enableHighAccuracy: true, 
                maximumAge: 3000, 
                timeout: 15000 
            });
        }

        // CONTROLADOR DE ARRANQUE MODIFICADO
        window.onload = gestionarCartografiaYArrancar;
    </script>
</body>
</html>
