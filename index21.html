<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CurvaaP Pro</title>
   
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3069/3069170.png">
   
    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
   
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { height: 100dvh; background-color: #687569; /* Fondo base adaptado */ color: #fff; overflow: hidden; touch-action: none; -webkit-text-size-adjust: none; }
        #navigator-container { display: flex; flex-direction: column; height: 100dvh; position: relative; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; transition: background-color 0.3s ease; }

        #initial-prompt-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 25, 20, 0.95); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; backdrop-filter: blur(5px); }
        #initial-prompt-overlay p { color: #aaa; margin-bottom: 30px; font-size: 15px; max-width: 320px; line-height: 1.5; }
        .prompt-buttons { display: flex; gap: 15px; width: 100%; max-width: 340px; justify-content: center; }
        .btn-prompt-later { background: transparent; color: #aaa; border: 2px solid #555; padding: 14px 0; border-radius: 25px; font-size: 13px; font-weight: bold; text-transform: uppercase; cursor: pointer; flex: 1; transition: all 0.2s; }
        .btn-prompt-later:active { background: #333; color: #fff; border-color: #fff; }
        .btn-prompt-download { background: #00ff66; color: #000; border: none; padding: 14px 0; border-radius: 25px; font-size: 13px; font-weight: bold; text-transform: uppercase; cursor: pointer; flex: 1; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0, 255, 102, 0.3); }
        .btn-prompt-download:active { background: #00cc52; transform: scale(0.98); }

        #download-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30, 36, 29, 0.98); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        #download-overlay p { color: #aaa; margin-bottom: 25px; font-size: 14px; max-width: 320px; line-height: 1.4; }
        #download-bar-container { width: 100%; max-width: 300px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 10px; border: 1px solid #444; }
        #download-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00ff66, #00e5ff); transition: width 0.1s ease; }
        .btn-cancelar-descarga { background: transparent; color: #aaa; border: 1px solid #666; padding: 12px 24px; border-radius: 25px; font-size: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: all 0.2s; margin-top: 30px; }
        .btn-cancelar-descarga:active { background: #333; border-color: #aaa; color: #fff; }

        #ui-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; padding: 0; touch-action: none; }

        #top-bar-container { display: flex; gap: 8px; width: 100%; pointer-events: none; align-items: stretch; padding: calc(env(safe-area-inset-top, 12px) + 14px) 14px 0 14px; }
        #search-block { background: rgba(25, 30, 24, 0.95); border: 1px solid #424d44; border-bottom: 3px solid #00ff66; padding: 10px; border-radius: 20px; pointer-events: auto; box-shadow: 0 6px 30px rgba(0,0,0,0.8); display: flex; gap: 8px; flex: 1; min-width: 0; }
        #destination-input { flex: 1; background: #1a2019; border: 1px solid #384237; color: #fff; padding: 12px 14px; font-size: 15px; border-radius: 25px; outline: none; min-width: 0; }
        #destination-input:focus { border-color: #00ff66; }
        .btn-action { background: #00ff66; color: #000; border: none; padding: 0 18px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; flex-shrink: 0; }

        #hud-top-danger-meter { width: 100%; height: 22vh; background: linear-gradient(to bottom, rgba(20,24,20,0.98) 65%, rgba(15,18,15,0.5) 88%, rgba(0,0,0,0)); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 20px; transition: background 0.3s ease; position: absolute; top: 0; left: 0; right: 0; }
        #danger-chevrons-container { display: flex; align-items: center; justify-content: center; gap: 8px; height: 70px; }
        .danger-chevron { width: 52px; height: 70px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.95)); }
        #hud-curve-distance { font-size: 56px; font-weight: 900; color: #ffffff; letter-spacing: -2px; line-height: 1; text-shadow: 0 4px 12px rgba(0,0,0,1); }

        #recenter-container { position: absolute; top: 25vh; right: 15px; display: none; pointer-events: auto; }
        .btn-recenter { background: #00ff66; color: #000; border: none; padding: 10px 18px; font-size: 12px; font-weight: bold; border-radius: 20px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        #hud-bottom-row { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 0 14px calc(env(safe-area-inset-bottom, 12px) + 24px) 14px; pointer-events: none; touch-action: none; gap: 15px; box-sizing: border-box; }
       
        #panel-left-telemetry { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; flex-shrink: 0; max-width: 45%; }
        .speed-pill { display: flex; align-items: center; background: rgba(25, 30, 24, 0.95); padding: 10px 20px; border-radius: 22px; border: 1px solid #424d44; box-shadow: 0 6px 20px rgba(0,0,0,0.8); width: fit-content; }
        .speed-wrapper { display: flex; align-items: baseline; }
        #speed-value { font-size: 46px; font-weight: 900; color: #00ff66; line-height: 1; }
        .speed-unit { font-size: 13px; color: #aaa; margin-left: 6px; font-weight: bold; text-transform: uppercase; }
        .speed-limit-sign { width: 36px; height: 36px; background-color: white; border: 4px solid #cc0000; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: black; font-weight: 900; font-size: 15px; margin-left: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); font-family: 'Arial', sans-serif; }

        #trip-totals-pill { display: none; background: rgba(25, 30, 24, 0.95); border: 1px solid #424d44; padding: 10px 18px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.7); font-weight: bold; font-size: 16px; color: #fff; gap: 12px; align-items: center; width: fit-content; }
        #trip-totals-pill span { color: #00ff66; font-weight: 900; }

        #panel-right-group { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; pointer-events: none; max-width: 55%; flex-grow: 1; justify-content: flex-end; min-width: 0; }
        #panel-right-street { display: none; pointer-events: auto; max-width: 100%; width: fit-content; }
        .street-pill { background: rgba(25, 30, 24, 0.95); border: 2px solid #00ff66; padding: 10px 14px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 10px; max-width: 100%; box-sizing: border-box; }
       
        #next-street-name {
            font-weight: 800; color: #ffffff; text-transform: uppercase; text-align: right; letter-spacing: 0.4px;
            flex: 0 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-close-route {
            background: #ff3d00; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        #bottom-right-actions { display: flex; gap: 10px; pointer-events: auto; justify-content: flex-end; }
        .btn-bottom-icon { background: rgba(25, 30, 24, 0.95); border: 1px solid #424d44; border-bottom: 3px solid #00ff66; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 30px rgba(0,0,0,0.8); transition: all 0.2s; flex-shrink: 0; touch-action: none; }
        .btn-bottom-icon svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .btn-bottom-icon:active { background: #384237; }
        #btn-download-offline { border-bottom-color: #00ff66; display: none; }
        #btn-download-offline svg { stroke: #00ff66; }

        .nav-arrow-marker { width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0px 8px 8px rgba(0,0,0,0.85)); transition: transform 0.2s linear; }
        #dynamic-alert-banner { position: absolute; top: 20px; left: 20px; right: 20px; background: #ff3d00; color: white; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; z-index: 999; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: auto; transition: background 0.3s ease; }

        @media (orientation: landscape) {
            #top-bar-container { padding: calc(env(safe-area-inset-top, 4px) + 10px) 14px 0 14px; }
            #hud-bottom-row { padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 20px) 14px; gap: 20px; }
            #hud-top-danger-meter { height: 25vh; flex-direction: row; justify-content: space-between; padding: 0 40px; border-radius: 0; top: 0; left: 0; right: 0; }
            #danger-chevrons-container { height: 42px; gap: 12px; }
            .danger-chevron { width: 28px; height: 42px; }
            #hud-curve-distance { font-size: 38px; }
            #recenter-container { top: 28vh; }
            #hud-bottom-row { align-items: center; }
            #panel-left-telemetry { flex-direction: row; align-items: center; gap: 12px; max-width: 50%; }
            .speed-pill { padding: 6px 16px; }
            #speed-value { font-size: 34px; }
            .speed-limit-sign { width: 28px; height: 28px; font-size: 12px; border-width: 3px; margin-left: 10px; }
            #trip-totals-pill { padding: 8px 14px; font-size: 14px; }
            .street-pill { padding: 8px 14px; }
            #next-street-name { font-size: 13px; }
            #panel-right-group { max-width: 45%; }
        }
    </style>
</head>
<body>

    <div id="initial-prompt-overlay">
        <h2 style="color: #fff; margin-bottom: 10px; font-weight: 800; letter-spacing: 0.5px;">¿DESCARGAR MAPA OFFLINE?</h2>
        <p>Te recomendamos descargar la cartografía para navegar sin usar datos móviles y evitar cortes en zonas de curvas sin cobertura.</p>
        <div class="prompt-buttons">
            <button class="btn-prompt-later" onclick="saltarDescargaInicial()">Más tarde</button>
            <button class="btn-prompt-download" onclick="iniciarDescargaDesdePrompt()">Descargar ahora</button>
        </div>
    </div>

    <div id="download-overlay">
        <h2 style="color: #fff; margin-bottom: 8px; font-weight: 800;">DESCARGANDO MAPA</h2>
        <p>Guardando la cartografía en tu dispositivo.</p>
        <div id="download-bar-container"><div id="download-bar"></div></div>
        <div id="download-progress" style="color: #00ff66; font-weight: 900; font-size: 20px;">0%</div>
        <button class="btn-cancelar-descarga" onclick="cancelarDescarga()">Cancelar</button>
    </div>

    <div id="dynamic-alert-banner" onclick="this.style.display='none'">⚠️ GPS sin precisión.</div>

    <div id="navigator-container">
        <div id="map"></div>
        <div id="ui-overlay">
            <div id="top-bar-container">
                <div id="search-block">
                    <input type="text" id="destination-input" placeholder="¿A dónde vamos con la moto?...">
                    <button class="btn-action" onclick="fijarRutaDestino()">Ir</button>
                </div>
            </div>

            <div id="hud-top-danger-meter">
                <div id="danger-chevrons-container"></div>
                <div id="hud-curve-distance">-- m</div>
            </div>

            <div id="recenter-container"><button class="btn-recenter" onclick="recenterManual()">✕ Recentrar</button></div>

            <div id="hud-bottom-row">
                <div id="panel-left-telemetry">
                    <div class="speed-pill">
                        <div class="speed-wrapper"><span id="speed-value">0</span><span class="speed-unit">km/h</span></div>
                        <div class="speed-limit-sign" id="speed-limit-value">90</div>
                    </div>
                    <div id="trip-totals-pill"><div id="total-distance-display">-- KM</div><div style="color: #444;">|</div><div id="total-time-display">-- MIN</div></div>
                </div>
               
                <div id="panel-right-group">
                    <div id="panel-right-street">
                        <div class="street-pill">
                            <span id="next-street-name">Ruta</span>
                            <button class="btn-close-route" onclick="cancelarRuta()">✕</button>
                        </div>
                    </div>

                    <div id="bottom-right-actions">
                        <button id="btn-download-offline" class="btn-bottom-icon" onclick="descargarMapaOffline()" title="Descargar Mapa Offline">
                            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        </button>
                        <button id="btn-fullscreen" class="btn-bottom-icon" onclick="toggleFullScreen()" title="Pantalla Completa">
                            <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>

    <script>
        const PMTILES_URL = 'https://files.catbox.moe/jv4azt.pmtiles';
        const NOMBRE_CACHE = 'motonav-map-store';
       
        let map;
        let arrowMarker;
        let miPosicion = [-4.4214, 36.7213];
        let destinoCoors = null;
        let lastValidBearing = 0;
        let nivelZoomActual = 14.5;
        let mapaDesplazadoPorUsuario = false;
        let autoRecenterTimer = null;
        let rutaActiva = false;
        let isRecalculating = false;

        let datosRutaGuardada = null;
        let geometriaRutaGuardada = null;
        let indicePasoActual = 0;
        let abortController = null;

        let initialDistanceKm = parseFloat(localStorage.getItem('initialDistanceKm') || '0');
        let initialDurationMin = parseFloat(localStorage.getItem('initialDurationMin') || '0');

        const getCenterOffset = () => [0, window.innerHeight * (window.innerHeight > window.innerWidth ? 0.16 : 0.04)];
       
        const CONFIG_PELIGRO = { low: { paneles: 1 }, medium: { paneles: 2 }, high: { paneles: 3 } };
        const ICONOS_ESPECIALES = {
            rotonda: `<svg class="danger-chevron" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:60px; height:60px;"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M4 12h4M16 12h4"/></svg>`,
            cruce: `<svg class="danger-chevron" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:55px; height:55px;"><path d="M12 2v20M2 12h20"/></svg>`
        };

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) { elem.requestFullscreen(); } else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); } else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            }
        }

        function calcularDistanciaHaversine(lon1, lat1, lon2, lat2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function cuantificarMetrosCurva(metros) {
            if (metros < 25) return "";
            if (metros <= 37) return "25 m";
            if (metros <= 75) return "50 m";
            if (metros <= 150) return "100 m";
            if (metros <= 250) return "200 m";
            if (metros <= 350) return "300 m";
            if (metros <= 450) return "400 m";
            return "";
        }

        function ponerEstiloVelocidadMaxima(calleInfo, esAutovia) {
            const nombre = calleInfo ? calleInfo.toUpperCase() : "";
            if (esAutovia || nombre.match(/\b(A|AP)-\d+/)) return "120";
            if (nombre.includes("N-") || nombre.includes("NACIONAL")) return "90";
            if (nombre.includes("AVENIDA") || nombre.includes("BOULEVARD") || nombre.includes("PASEO")) return "50";
            if (nombre.includes("CALLE") || nombre.includes("C/ ") || nombre.includes("C.") || nombre.includes("PLAZA") || nombre.includes("CAMINO")) return "30";
            return "90";
        }

        function mostrarNotificacionPersonalizada(mensaje, colorFondo, colorTexto) {
            const banner = document.getElementById('dynamic-alert-banner');
            banner.innerText = mensaje; banner.style.background = colorFondo; banner.style.color = colorTexto;
            banner.style.display = 'block';
            setTimeout(() => {
                banner.style.display = 'none'; banner.innerText = '⚠️ GPS sin precisión.'; banner.style.background = '#ff3d00'; banner.style.color = 'white';
            }, 4000);
        }

        function saltarDescargaInicial() {
            document.getElementById('initial-prompt-overlay').style.display = 'none';
            document.getElementById('btn-download-offline').style.display = 'flex';
        }

        function iniciarDescargaDesdePrompt() {
            document.getElementById('initial-prompt-overlay').style.display = 'none';
            descargarMapaOffline();
        }

        async function descargarMapaOffline() {
            const overlay = document.getElementById('download-overlay');
            const barra = document.getElementById('download-bar');
            const progreso = document.getElementById('download-progress');
            overlay.style.display = 'flex'; barra.style.width = '0%'; progreso.innerText = '0%';
            abortController = new AbortController();

            try {
                const respuesta = await fetch(PMTILES_URL, { signal: abortController.signal });
                if (!respuesta.ok) throw new Error("Fallo de red.");
                const tamanoTotal = parseInt(respuesta.headers.get('content-length') || '0', 10);
                const lector = respuesta.body.getReader();
                let bytesDescargados = 0; const fragmentos = [];

                while(true) {
                    const {done, value} = await lector.read();
                    if (done) break;
                    fragmentos.push(value); bytesDescargados += value.length;
                    if (tamanoTotal > 0) {
                        const porcentaje = Math.round((bytesDescargados / tamanoTotal) * 100);
                        barra.style.width = porcentaje + '%'; progreso.innerText = porcentaje + '%';
                    }
                }
                const mapaCompletoBlob = new Blob(fragmentos);
                const cache = await caches.open(NOMBRE_CACHE);
                await cache.put(PMTILES_URL, new Response(mapaCompletoBlob, { headers: { 'Content-Type': 'application/octet-stream' } }));
                overlay.style.display = 'none';
                document.getElementById('btn-download-offline').style.display = 'none';
                mostrarNotificacionPersonalizada("✅ Mapa descargado con éxito.", "#00ff66", "#000");
            } catch (error) {
                overlay.style.display = 'none'; document.getElementById('btn-download-offline').style.display = 'flex';
                if (error.name !== 'AbortError') mostrarNotificacionPersonalizada("❌ Error al descargar el mapa.", "#ff3d00", "white");
            }
        }

        function cancelarDescarga() { if (abortController) abortController.abort(); }

        async function initNavigator() {
            const protocol = new pmtiles.Protocol();
            maplibregl.addProtocol("pmtiles", protocol.tile);
            let urlIdentificador = PMTILES_URL; let mapaOfflineListo = false;

            try {
                const cache = await caches.open(NOMBRE_CACHE);
                const respuestaGuardada = await cache.match(PMTILES_URL);
                if (respuestaGuardada) {
                    const mapaCompletoBlob = await respuestaGuardada.blob();
                    const fuenteLocal = {
                        getKey: () => "mapa-motonat-local",
                        getBytes: async (offset, length) => {
                            const corte = mapaCompletoBlob.slice(offset, offset + length);
                            return { data: await corte.arrayBuffer() };
                        }
                    };
                    protocol.add(new pmtiles.PMTiles(fuenteLocal));
                    urlIdentificador = "mapa-motonat-local"; mapaOfflineListo = true;
                } else {
                    protocol.add(new pmtiles.PMTiles(PMTILES_URL));
                }
            } catch (error) { protocol.add(new pmtiles.PMTiles(PMTILES_URL)); }

            if (!mapaOfflineListo) document.getElementById('initial-prompt-overlay').style.display = 'flex';

            const ESTILO_MINIMALISTA_OFFLINE = {
                "version": 8,
                "sources": { "mapa-curvas-source": { "type": "vector", "url": "pmtiles://" + urlIdentificador, "attribution": "© OSM" } },
                "glyphs": "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
                "layers": [
                    { "id": "fondo-tierra", "type": "background", "paint": { "background-color": "#687569" } },
                    { "id": "capa-bosques-landuse", "type": "fill", "source": "mapa-curvas-source", "source-layer": "landuse", "filter": ["any", ["match", ["get", "class"], ["forest", "wood", "nature_reserve", "park", "orchard", "vineyard", "grass"], true, false], ["match", ["get", "kind"], ["forest", "wood", "nature_reserve", "park", "orchard", "vineyard", "grass"], true, false]], "paint": { "fill-color": "#5c6b5d", "fill-opacity": 0.8 } },
                    { "id": "capa-bosques-landcover", "type": "fill", "source": "mapa-curvas-source", "source-layer": "landcover", "filter": ["any", ["match", ["get", "class"], ["wood", "forest", "grass", "park"], true, false], ["match", ["get", "kind"], ["wood", "forest", "grass", "park"], true, false]], "paint": { "fill-color": "#5c6b5d", "fill-opacity": 0.8 } },
                    { "id": "capa-bosques-natural", "type": "fill", "source": "mapa-curvas-source", "source-layer": "natural", "filter": ["any", ["match", ["get", "class"], ["wood", "forest", "scrub"], true, false], ["match", ["get", "kind"], ["wood", "forest", "scrub"], true, false]], "paint": { "fill-color": "#5c6b5d", "fill-opacity": 0.8 } },
                    { "id": "capa-agua", "type": "fill", "source": "mapa-curvas-source", "source-layer": "water", "paint": { "fill-color": "#2a3f54" } },

        function renderizarHUDCurva(direccion, peligrosidad, tipoEspecial) {
            const container = document.getElementById('danger-chevrons-container');
            const mapaElement = document.getElementById('map');
            const hudTop = document.getElementById('hud-top-danger-meter');
            container.innerHTML = '';

            const GRADIENTES = {
                low: 'linear-gradient(to bottom, rgba(0, 200, 50, 0.98) 55%, rgba(0, 200, 50, 0.3) 88%, rgba(0,0,0,0))',      
                medium: 'linear-gradient(to bottom, rgba(255, 140, 0, 0.98) 55%, rgba(255, 140, 0, 0.3) 88%, rgba(0,0,0,0))',
                high: 'linear-gradient(to bottom, rgba(255, 0, 0, 0.98) 55%, rgba(255, 0, 0, 0.3) 88%, rgba(0,0,0,0))'        
            };

            if (tipoEspecial) {
                mapaElement.style.backgroundColor = 'transparent';
                hudTop.style.background = GRADIENTES.low;
                if (tipoEspecial.includes('roundabout') || tipoEspecial.includes('rotary')) {
                    container.innerHTML = ICONOS_ESPECIALES.rotonda;
                } else if (tipoEspecial === 'intersection') {
                    container.innerHTML = ICONOS_ESPECIALES.cruce;
                }
                return;
            }

            const config = CONFIG_PELIGRO[peligrosidad] || CONFIG_PELIGRO.low;

            if (peligrosidad === 'medium') {
                mapaElement.style.backgroundColor = 'rgba(255, 140, 0, 0.12)';
                hudTop.style.background = GRADIENTES.medium;
            } else if (peligrosidad === 'high') {
                mapaElement.style.backgroundColor = 'rgba(255, 0, 0, 0.16)';
                hudTop.style.background = GRADIENTES.high;
            } else {
                mapaElement.style.backgroundColor = 'rgba(0, 200, 50, 0.1)';
                hudTop.style.background = GRADIENTES.low;
            }

            const scaleX = (direccion === 'izq') ? -1 : 1;
            const svgChevron = `<svg class="danger-chevron" style="transform: scaleX(${scaleX});" viewBox="0 0 24 24" fill="none"><path d="M10 5L17 12L10 19" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
            for (let i = 0; i < config.paneles; i++) { container.innerHTML += svgChevron; }
        }

        async function fijarRutaDestino() {
            const query = document.getElementById('destination-input').value; if (!query) return;
            try {
                const searchResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const searchData = await searchResponse.json(); if (searchData.length === 0) return;
                destinoCoors = [parseFloat(searchData[0].lon), parseFloat(searchData[0].lat)];
               
                const routeResponse = await fetch(`https://router.project-osrm.org/route/v1/driving/${miPosicion[0]},${miPosicion[1]};${destinoCoors[0]},${destinoCoors[1]}?overview=full&geometries=geojson&steps=true`);
                const routeData = await routeResponse.json(); if (!routeData.routes || routeData.routes.length === 0) return;
               
                const dataRuta = routeData.routes[0];
                datosRutaGuardada = dataRuta.legs[0].steps;
                geometriaRutaGuardada = dataRuta.geometry;
                indicePasoActual = 0; rutaActiva = true;
               
                initialDistanceKm = dataRuta.distance / 1000;
                initialDurationMin = dataRuta.duration / 60;

                localStorage.setItem('destinoMoto', query); localStorage.setItem('coorsMoto', JSON.stringify(destinoCoors));
                localStorage.setItem('pasosRutaMoto', JSON.stringify(datosRutaGuardada)); localStorage.setItem('indicePasoMoto', '0');
                localStorage.setItem('geometriaRutaMoto', JSON.stringify(geometriaRutaGuardada));
                localStorage.setItem('initialDistanceKm', initialDistanceKm.toString());
                localStorage.setItem('initialDurationMin', initialDurationMin.toString());
               
                map.getSource('route-source').setData({ type: 'FeatureCollection', features: [{ type: 'Feature', geometry: geometriaRutaGuardada, properties: {} }] });
               
                document.getElementById('top-bar-container').style.display = 'none';
                document.getElementById('trip-totals-pill').style.display = 'flex';
                document.getElementById('panel-right-street').style.display = 'flex';
               
                procesarLogicaOffline(); recenterManual();
            } catch (error) { console.error(error); }
        }

        async function recalcularRutaAutomatica() {
            if (isRecalculating || !destinoCoors) return;
            isRecalculating = true;
            mostrarNotificacionPersonalizada("Recalculando ruta...", "#ffb300", "#000");
            try {
                const routeResponse = await fetch(`https://router.project-osrm.org/route/v1/driving/${miPosicion[0]},${miPosicion[1]};${destinoCoors[0]},${destinoCoors[1]}?overview=full&geometries=geojson&steps=true`);
                const routeData = await routeResponse.json();
                if (routeData.routes && routeData.routes.length > 0) {
                    const dataRuta = routeData.routes[0];
                    datosRutaGuardada = dataRuta.legs[0].steps;
                    geometriaRutaGuardada = dataRuta.geometry;
                    indicePasoActual = 0;
                   
                    initialDistanceKm = dataRuta.distance / 1000;
                    initialDurationMin = dataRuta.duration / 60;

                    localStorage.setItem('pasosRutaMoto', JSON.stringify(datosRutaGuardada));
                    localStorage.setItem('indicePasoMoto', '0');
                    localStorage.setItem('geometriaRutaMoto', JSON.stringify(geometriaRutaGuardada));
                    localStorage.setItem('initialDistanceKm', initialDistanceKm.toString());
                    localStorage.setItem('initialDurationMin', initialDurationMin.toString());
                   
                    map.getSource('route-source').setData({ type: 'FeatureCollection', features: [{ type: 'Feature', geometry: geometriaRutaGuardada, properties: {} }] });
                    procesarLogicaOffline();
                }
            } catch (error) {
                console.error("Fallo al recalcular", error);
            }
            isRecalculating = false;
        }

        function procesarLogicaOffline() {
            if (!rutaActiva || !geometriaRutaGuardada || typeof turf === 'undefined') return;

            let mostrarCruceOSRM = false;
            let tipoCruceOSRM = null;
            let metrosAlCruce = 9999;
            let esAutovia = false;

            if (datosRutaGuardada && indicePasoActual < datosRutaGuardada.length) {
                let pasoActual = datosRutaGuardada[indicePasoActual];
                let destinoGiroCoors = pasoActual.maneuver.location;
                let metrosRealesGiro = Math.round(calcularDistanciaHaversine(miPosicion[0], miPosicion[1], destinoGiroCoors[0], destinoGiroCoors[1]));

                if (metrosRealesGiro <= 15 && (indicePasoActual + 1) < datosRutaGuardada.length) {
                    indicePasoActual++;
                    localStorage.setItem('indicePasoMoto', indicePasoActual.toString());
                    pasoActual = datosRutaGuardada[indicePasoActual];
                    destinoGiroCoors = pasoActual.maneuver.location;
                    metrosRealesGiro = Math.round(calcularDistanciaHaversine(miPosicion[0], miPosicion[1], destinoGiroCoors[0], destinoGiroCoors[1]));
                }

                const calleActualInfo = pasoActual.name || pasoActual.ref || "En ruta";
                let proximoGiro = datosRutaGuardada[indicePasoActual + 1] || pasoActual;
                const proximaCalleInfo = proximoGiro.name || proximoGiro.ref || "Tramo Continuo";
               
                esAutovia = /A-\d|AP-\d|Autovía|Autopista/i.test(calleActualInfo) || /A-\d|AP-\d|Autovía|Autopista/i.test(proximaCalleInfo);

                const nextStreetEl = document.getElementById('next-street-name');
                nextStreetEl.innerText = proximaCalleInfo;
                nextStreetEl.style.fontSize = '';

                const charCount = proximaCalleInfo.length;
                if (charCount > 30) {
                    nextStreetEl.style.fontSize = '10px';
                } else if (charCount > 25) {
                    nextStreetEl.style.fontSize = '11px';
                } else if (charCount > 20) {
                    nextStreetEl.style.fontSize = '13px';
                } else {
                    nextStreetEl.style.fontSize = '15px';
                }

                document.getElementById('speed-limit-value').innerText = ponerEstiloVelocidadMaxima(calleActualInfo, esAutovia);

                const tipoManiobra = proximoGiro.maneuver.type;
                if (metrosRealesGiro <= 400 && (tipoManiobra.includes('roundabout') || tipoManiobra.includes('rotary') || tipoManiobra === 'intersection')) {
                    mostrarCruceOSRM = true;
                    tipoCruceOSRM = tipoManiobra;
                    metrosAlCruce = metrosRealesGiro;
                }
            }

            const line = turf.lineString(geometriaRutaGuardada.coordinates);
            const pt = turf.point(miPosicion);
            const snapped = turf.nearestPointOnLine(line, pt, {units: 'kilometers'});
            const routeStart = turf.point(geometriaRutaGuardada.coordinates[0]);

            let distCurrentKm = 0;
            try {
                const travelledLine = turf.lineSlice(routeStart, snapped, line);
                distCurrentKm = turf.length(travelledLine, {units: 'kilometers'});
            } catch(e) {}

            const totalRouteLengthKm = turf.length(line, {units: 'kilometers'});
            let distRemainingKm = totalRouteLengthKm - distCurrentKm;
            if (distRemainingKm < 0) distRemainingKm = 0;

            document.getElementById('total-distance-display').innerHTML = `<span>${distRemainingKm.toFixed(1)}</span> KM`;

            let remainingMinutos = 0;
            if (initialDistanceKm > 0) {
                remainingMinutos = Math.round((distRemainingKm / initialDistanceKm) * initialDurationMin);
            } else {
                remainingMinutos = Math.round((distRemainingKm / 60) * 60);
            }
            if (remainingMinutos < 0) remainingMinutos = 0;

            if (remainingMinutos >= 60) {
                document.getElementById('total-time-display').innerHTML = `<span>${Math.floor(remainingMinutos / 60)}h ${remainingMinutos % 60}m</span>`;
            } else {
                document.getElementById('total-time-display').innerHTML = `<span>${remainingMinutos}</span> MIN`;
            }

            const lookAheadKm = 0.4;
            const upcomingLine = turf.lineSliceAlong(line, distCurrentKm, distCurrentKm + lookAheadKm, {units: 'kilometers'});
            const upcomingLengthKm = turf.length(upcomingLine, {units: 'kilometers'});

            let detectedCurve = false;
            let curveStartDist = 0;
            let curveLength = 0;
            let curvePeakAngle = 0;
            let curveDir = null;

            const stepKm = 0.02;

            if (upcomingLengthKm > stepKm * 2) {
                let startHeading = turf.bearing(
                    turf.along(upcomingLine, 0, {units: 'kilometers'}),
                    turf.along(upcomingLine, stepKm, {units: 'kilometers'})
                );

                for (let d = stepKm; d < upcomingLengthKm - stepKm; d += stepKm) {
                    let p1 = turf.along(upcomingLine, d, {units: 'kilometers'});
                    let p2 = turf.along(upcomingLine, d + stepKm, {units: 'kilometers'});
                    let futureHeading = turf.bearing(p1, p2);
                   
                    let diff = futureHeading - startHeading;
                   
                    while (diff <= -180) diff += 360;
                    while (diff > 180) diff -= 360;

                    let absDiff = Math.abs(diff);

                    if (!detectedCurve) {
                        if (absDiff >= 12) {
                            detectedCurve = true;
                            curveStartDist = d * 1000;
                            curveDir = diff > 0 ? 'der' : 'izq';
                            curvePeakAngle = absDiff;
                            curveLength = 20;
                        }
                    } else {
                        if ((diff > 0 && curveDir === 'der') || (diff < 0 && curveDir === 'izq')) {
                           
                            let pPrev1 = turf.along(upcomingLine, d - stepKm, {units: 'kilometers'});
                            let pPrev2 = turf.along(upcomingLine, d, {units: 'kilometers'});
                            let prevSegHeading = turf.bearing(pPrev1, pPrev2);
                           
                            let localDiff = futureHeading - prevSegHeading;
                            while (localDiff <= -180) localDiff += 360;
                            while (localDiff > 180) localDiff -= 360;

                            if ((curveDir === 'der' && localDiff < -10) || (curveDir === 'izq' && localDiff > 10)) {
                                break;
                            }

                            curveLength += 20;
                            if (absDiff > curvePeakAngle) {
                                curvePeakAngle = absDiff;
                            }
                        } else {
                            break;
                        }
                    }
                }
            }

            let peligrosidad = 'low';
            if (detectedCurve && curveLength > 0) {
                let severidad = curvePeakAngle / curveLength;
               
                if (severidad >= 1.2) peligrosidad = 'high';
                else if (severidad >= 0.6) peligrosidad = 'medium';
            }

            const hudTop = document.getElementById('hud-top-danger-meter');
            const hudDistanceEl = document.getElementById('hud-curve-distance');
            const mapElement = document.getElementById('map');

            if (esAutovia && peligrosidad !== 'high' && !mostrarCruceOSRM) {
                detectedCurve = false;
            }

            if (mostrarCruceOSRM && (!detectedCurve || metrosAlCruce <= curveStartDist + 50)) {
                hudTop.style.display = 'flex';
                hudDistanceEl.style.display = 'block';
                hudDistanceEl.innerText = cuantificarMetrosCurva(metrosAlCruce);
                renderizarHUDCurva('recto', 'low', tipoCruceOSRM);
            }
            else if (detectedCurve) {
                hudTop.style.display = 'flex';
                const textoMetros = cuantificarMetrosCurva(curveStartDist);
                if (textoMetros === "") {
                    hudDistanceEl.style.display = 'none';
                } else {
                    hudDistanceEl.style.display = 'block';
                    hudDistanceEl.innerText = textoMetros;
                }
                renderizarHUDCurva(curveDir, peligrosidad, null);
            }
            else {
                hudTop.style.display = 'none';
                mapElement.style.backgroundColor = 'transparent';
            }
        }

        function cancelarRuta() {
            rutaActiva = false; destinoCoors = null; datosRutaGuardada = null; geometriaRutaGuardada = null; indicePasoActual = 0;
            initialDistanceKm = 0; initialDurationMin = 0;

            localStorage.removeItem('destinoMoto'); localStorage.removeItem('coorsMoto'); localStorage.removeItem('pasosRutaMoto'); localStorage.removeItem('indicePasoMoto'); localStorage.removeItem('geometriaRutaMoto');
            localStorage.removeItem('initialDistanceKm'); localStorage.removeItem('initialDurationMin');
           
            map.getSource('route-source').setData({ type: 'FeatureCollection', features: [] });
            document.getElementById('map').style.backgroundColor = 'transparent'; document.getElementById('hud-top-danger-meter').style.display = 'none';
            document.getElementById('trip-totals-pill').style.display = 'none'; document.getElementById('panel-right-street').style.display = 'none';
           
            document.getElementById('top-bar-container').style.display = 'flex';
            document.getElementById('destination-input').value = '';
            recenterManual();
        }

        function arrancarSeguimientoGPS() {
            if (!navigator.geolocation) return;
           
            navigator.geolocation.watchPosition((position) => {
                document.getElementById('dynamic-alert-banner').style.display = 'none';
                miPosicion = [position.coords.longitude, position.coords.latitude];
                const velocidad = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;
               
                if (position.coords.heading !== null && !isNaN(position.coords.heading)) {
                    let nuevoHeading = position.coords.heading; let dif = nuevoHeading - lastValidBearing;
                    if (dif > 180) nuevoHeading -= 360; else if (dif < -180) nuevoHeading += 360;
                    lastValidBearing = lastValidBearing + (nuevoHeading - lastValidBearing) * 0.4;
                }
               
                document.getElementById('speed-value').innerText = velocidad; arrowMarker.setLngLat(miPosicion);
                const arrowElement = document.querySelector('.nav-arrow-marker');
                if (arrowElement) { arrowElement.style.transform = `rotate(${lastValidBearing}deg)`; }
               
                if (rutaActiva) {
                    procesarLogicaOffline();

                    if (geometriaRutaGuardada && typeof turf !== 'undefined') {
                        try {
                            const pt = turf.point(miPosicion);
                            const line = turf.lineString(geometriaRutaGuardada.coordinates);
                            const distanciaRuta = turf.pointToLineDistance(pt, line, {units: 'meters'});
                           
                            if (distanciaRuta > 18) {
                                if (navigator.onLine) {
                                    recalcularRutaAutomatica();
                                } else {
                                    mostrarNotificacionPersonalizada("Desvío de ruta. Sin conexión para recalcular.", "#ff3d00", "#fff");
                                }
                            }
                        } catch (err) {}
                    }
                }
               
                if (!mapaDesplazadoPorUsuario) { map.easeTo({ center: miPosicion, bearing: lastValidBearing, zoom: nivelZoomActual, offset: getCenterOffset(), duration: 800, easing: (t) => t * (2 - t) }); }
            }, (err) => { document.getElementById('dynamic-alert-banner').style.display = 'block'; }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
        }

        if ('wakeLock' in navigator) {
            let wakeLockInstance = null; const requestWakeLock = async () => { try { wakeLockInstance = await navigator.wakeLock.request('screen'); } catch (err) {} };
            document.addEventListener('visibilitychange', () => { if (wakeLockInstance !== null && document.visibilityState === 'visible') { requestWakeLock(); } });
            requestWakeLock();
        }

        window.onload = initNavigator;
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(err => console.error(err)); }
    </script>
